<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Midnight Garden 🌙</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at 70% 15%, rgba(40,40,80,.18), transparent 35%),
linear-gradient(
180deg,
#010107,
#030314 55%,
#000005
);

}


/* Moon */

.moon{

position:absolute;

top:80px;
right:100px;

width:140px;
height:140px;

border-radius:50%;

background:

radial-gradient(
circle at 35% 35%,
#d8d8d8,
#999 65%,
#555
);

opacity:.8;

box-shadow:

0 0 25px rgba(220,220,255,.35),
0 0 80px rgba(180,180,255,.15);

}


.moon::before{

content:"";

position:absolute;

width:22px;
height:22px;

background:#777;

border-radius:50%;

top:35px;
left:35px;

opacity:.4;

box-shadow:

45px 20px 0 7px #777,
30px 75px 0 5px #555;

}


/* Stars */

.star{

position:absolute;

background:white;

border-radius:50%;

opacity:.4;

}


.star.glow{

box-shadow:
0 0 5px white,
0 0 12px white;

animation:twinkle 4s infinite;

}


@keyframes twinkle{

0%,100%{
opacity:.25;
}

50%{
opacity:1;
}

}


/* Shooting stars */

.shooting{

position:absolute;

width:130px;

height:2px;

background:
linear-gradient(
90deg,
transparent,
white
);

transform:rotate(-45deg);

filter:
drop-shadow(0 0 8px white);

opacity:0;

animation:
meteor 5s linear;

}


.shooting::after{

content:"";

position:absolute;

right:0;

top:-2px;

width:6px;

height:6px;

background:white;

border-radius:50%;

box-shadow:
0 0 15px white;

}


@keyframes meteor{


0%{

left:110%;
top:-10%;
opacity:0;

}


10%{

opacity:1;

}


40%{

left:40%;
top:40%;

opacity:0;

}


100%{

opacity:0;

}

}



/* Rose petals */

.petal{

position:absolute;

background:

linear-gradient(
135deg,
#8b0035,
#300010
);

width:12px;

height:18px;

border-radius:
100% 0 100% 0;

opacity:.6;

filter:
drop-shadow(0 0 4px #8b0035);

animation:
petalFall linear infinite;

}


@keyframes petalFall{


0%{

transform:
translate3d(0,-10vh,0)
rotate(0);

}


50%{

transform:
translate3d(70px,50vh,0)
rotate(180deg);

}


100%{

transform:
translate3d(-40px,110vh,0)
rotate(360deg);

}

}



/* Constellations */

.constellation{

position:absolute;

opacity:0;

transition:
opacity 4s ease;

}


.constellation.active{

opacity:.7;

}


.point{

position:absolute;

width:3px;

height:3px;

background:white;

border-radius:50%;

box-shadow:
0 0 8px white;

}


.line{

position:absolute;

height:1px;

background:
rgba(255,255,255,.25);

transform-origin:left;

}



/* Messages */

.star-message{

position:absolute;

color:white;

font-family:serif;

font-size:14px;

letter-spacing:3px;

opacity:0;

transition:
opacity 5s ease;

text-shadow:
0 0 10px white;

}


.star-message.show{

opacity:.45;

}


</style>

</head>


<body>


<div class="moon"></div>



<script>


// Stars

for(let i=0;i<300;i++){

let star=document.createElement("div");

star.className="star";


let size=Math.random()*2+0.5;


star.style.width=size+"px";

star.style.height=size+"px";


star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";


if(Math.random()>.8){

star.classList.add("glow");

star.style.animationDelay=
Math.random()*5+"s";

}


document.body.appendChild(star);

}



// Meteors

function meteor(){

let m=document.createElement("div");

m.className="shooting";

m.style.top=
Math.random()*40+"vh";

document.body.appendChild(m);


setTimeout(()=>m.remove(),5000);

}


setInterval(meteor,4500);



// Petals

for(let i=0;i<18;i++){

let p=document.createElement("div");

p.className="petal";


p.style.left=
Math.random()*100+"vw";


p.style.animationDuration=
(Math.random()*12+14)+"s";


p.style.animationDelay=
Math.random()*15+"s";


document.body.appendChild(p);

}



// Constellations


let messages=[

"M + L",

"Te amo Mayritangas",

"Eres lo más especial para mí"

];


function constellation(){


let c=document.createElement("div");

c.className="constellation";


c.style.left=
(Math.random()*60+15)+"vw";


c.style.top=
(Math.random()*35+10)+"vh";


let points=[

[0,0],
[35,20],
[70,0],
[35,55],
[80,70]

];


points.forEach((p,i)=>{

let star=document.createElement("div");

star.className="point";

star.style.left=p[0]+"px";

star.style.top=p[1]+"px";


c.appendChild(star);


if(i>0){

let line=document.createElement("div");

line.className="line";


let prev=points[i-1];


let distance=Math.sqrt(

(p[0]-prev[0])**2+
(p[1]-prev[1])**2

);


line.style.width=distance+"px";

line.style.left=prev[0]+"px";

line.style.top=prev[1]+"px";


let angle=Math.atan2(

p[1]-prev[1],
p[0]-prev[0]

);


line.style.transform=
`rotate(${angle}rad)`;


c.appendChild(line);

}


});


document.body.appendChild(c);


setTimeout(()=>{

c.classList.add("active");

},100);


setTimeout(()=>{

c.classList.remove("active");

},9000);


setTimeout(()=>{

c.remove();

},14000);

}


setInterval(constellation,12000);



// Star messages


function message(){


let m=document.createElement("div");

m.className="star-message";


m.innerHTML=
messages[
Math.floor(Math.random()*messages.length)
];


m.style.left=
(Math.random()*60+20)+"vw";


m.style.top=
(Math.random()*40+15)+"vh";


document.body.appendChild(m);


setTimeout(()=>{

m.classList.add("show");

},100);


setTimeout(()=>{

m.classList.remove("show");

},6000);


setTimeout(()=>{

m.remove();

},12000);


}


setInterval(message,18000);


</script>


</body>
</html>
