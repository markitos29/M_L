<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tú y yo por siempre mi niña</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#scene{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
}
#background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

#lake-waves{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;opacity:.98}


#moon-halo{
    position:absolute;
    z-index:1;
    pointer-events:none;
    width:240px;
    height:240px;
    border-radius:50%;
    opacity:.48;
    background:
        radial-gradient(circle,
            rgba(255,242,205,.20) 0%,
            rgba(255,230,185,.10) 24%,
            rgba(190,210,255,.045) 48%,
            transparent 72%);
    filter:blur(12px);
    mix-blend-mode:screen;
    animation:moonBreathe 7s ease-in-out infinite;
}

@keyframes moonBreathe{
    0%,100%{transform:translate(-50%,-50%) scale(.97);opacity:.38}
    50%{transform:translate(-50%,-50%) scale(1.04);opacity:.58}
}


body.memory-breath #sky{
    animation:skyMemoryBreath 3.2s cubic-bezier(.22,.61,.36,1) both;
}

body.memory-breath #moon-halo{
    animation:moonMemoryBreath 3.2s cubic-bezier(.22,.61,.36,1) both;
}

body.memory-breath #lake-waves{
    animation:lakeMemoryBreath 3.2s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes skyMemoryBreath{
    0%,100%{
        filter:brightness(1.55) drop-shadow(0 0 3px rgba(255,255,255,.38));
        transform:scale(1);
    }
    48%{
        filter:
            brightness(1.92)
            drop-shadow(0 0 7px rgba(255,255,255,.72))
            drop-shadow(0 0 14px rgba(255,225,180,.22));
        transform:scale(1.008);
    }
}

@keyframes moonMemoryBreath{
    0%,100%{
        opacity:.42;
        transform:translate(-50%,-50%) scale(.98);
    }
    48%{
        opacity:.68;
        transform:translate(-50%,-50%) scale(1.08);
    }
}

@keyframes lakeMemoryBreath{
    0%,100%{opacity:.78}
    48%{opacity:.94}
}

@media(prefers-reduced-motion:reduce){
    #moon-halo{animation:none}
}

#sky{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;filter:brightness(1.55) drop-shadow(0 0 3px rgba(255,255,255,.38));transition:filter .12s ease-out}
#memory-aura{position:absolute;inset:-20%;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,rgba(255,244,210,.18),rgba(255,229,182,.08) 28%,transparent 62%);filter:blur(28px);transform:scale(.92);transition:opacity 1.1s ease,transform 1.1s ease}
#polaroid-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.polaroid{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;pointer-events:auto;transform-origin:50% 0%;will-change:transform;appearance:none;-webkit-appearance:none}
.polaroid-card{position:absolute;inset:0;display:block;overflow:hidden;padding:3px 3px 10px;background:#e8dfcf;border:1px solid rgba(214,199,174,.95);outline:1px solid rgba(255,239,211,.18);outline-offset:-1px;box-shadow:0 0 5px rgba(255,226,177,.28),0 0 12px rgba(221,181,125,.18),0 4px 10px rgba(0,0,0,.48);filter:brightness(.94) sepia(.10) saturate(.88);transition:box-shadow .35s ease,filter .35s ease,transform .35s ease,opacity .35s ease}
.polaroid-media{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;background:#151515}
.polaroid:hover .polaroid-card,.polaroid:focus-visible .polaroid-card{background:#ede4d5;box-shadow:0 0 8px rgba(255,236,204,.55),0 0 20px rgba(225,184,126,.32),0 7px 14px rgba(0,0,0,.52);filter:brightness(1) sepia(.08) saturate(.92);transform:translateY(-2px) scale(1.025)}
.polaroid:focus-visible{outline:none}
.polaroid.is-origin-hidden .polaroid-card{opacity:0}
#memory-dim{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at center,rgba(3,5,12,.12),rgba(0,0,0,.35) 70%,rgba(0,0,0,.58));transition:opacity 1s ease}
#effect-layer{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#memory-stage{position:absolute;inset:0;z-index:6;pointer-events:none}
#memory-card{position:absolute;left:0;top:0;display:none;width:42px;height:57px;padding:0;border:1px solid rgba(255,242,215,.45);border-radius:18px;background:rgba(8,10,16,.88);box-shadow:0 0 18px rgba(255,240,205,.34),0 0 55px rgba(255,222,170,.20),0 24px 65px rgba(0,0,0,.58);transform-origin:center;will-change:transform,width,height,left,top;pointer-events:auto;cursor:default;overflow:hidden}
#memory-card.is-active{display:block}
#memory-card img,#memory-card video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#090b12;filter:brightness(.96) contrast(1.02) saturate(.94)}
#memory-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(to bottom,rgba(5,8,16,.10),transparent 22%,transparent 74%,rgba(4,6,12,.24));box-shadow:inset 0 0 42px rgba(5,8,16,.34)}

body.memory-open #background{filter:blur(1.5px) brightness(.72) saturate(.92);transform:scale(1.006)}
body.memory-open #sky{z-index:8;filter:brightness(1.8) drop-shadow(0 0 4px rgba(255,255,255,.55))}
body.memory-open #memory-dim{opacity:1}
body.memory-open #memory-aura{opacity:1;transform:scale(1)}
.fx-dot,.fx-star,.fx-firefly{position:absolute;border-radius:50%;background:rgba(255,248,226,.95);box-shadow:0 0 10px rgba(255,235,190,.85)}
.fx-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(255,247,220,.8),transparent);transform-origin:left center}
.fx-heart{position:absolute;color:rgba(255,235,220,.95);text-shadow:0 0 12px rgba(255,214,190,.7);font-size:18px}
.fx-ripple{position:absolute;border:1px solid rgba(255,242,210,.7);border-radius:50%;box-shadow:0 0 18px rgba(255,225,180,.25)}
.fx-letter{position:absolute;color:rgba(255,244,220,.92);font-family:Georgia,serif;font-size:28px;letter-spacing:8px;text-shadow:0 0 14px rgba(255,225,180,.55)}
.fx-shoot{position:absolute;width:180px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,236,196,.55),transparent);box-shadow:0 0 10px rgba(255,255,255,.65);transform:rotate(35deg)}
.fx-develop{filter:grayscale(1) brightness(1.35)!important;transition:filter 1.4s ease!important}
@media(max-width:700px){#memory-close{top:max(12px,env(safe-area-inset-top));right:12px}}
#memory-caption{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    width:min(82%,900px);

    color:#f7ecd4;

    font-family:
        "Snell Roundhand",
        "Apple Chancery",
        "Bradley Hand",
        cursive;

    font-size:clamp(22px,2.3vw,38px);
    text-align:center;
    line-height:1.35;

    text-shadow:
        0 2px 8px rgba(0,0,0,.95),
        0 0 18px rgba(255,214,145,.25);

    opacity:0;
    transition:opacity .8s ease 1s;

    pointer-events:none;
}

#memory-caption.show{
    opacity:1;
}
    @media (max-width:700px){

    #scene{
        height:100dvh;
    }

    #background{
        object-fit:contain;
        object-position:center bottom;
    }

    .polaroid{
        min-width:30px;
        min-height:40px;
    }

}
    #music-button{
    position:absolute;
    z-index:50;

    width:58px;
    height:58px;

    padding:0;
    overflow:hidden;

    border:1px solid rgba(255,230,210,.38);
    border-radius:50%;

    background:rgba(15,4,6,.42);
    cursor:pointer;

    box-shadow:
        0 0 14px rgba(255,90,90,.28),
        0 0 28px rgba(180,20,35,.18),
        0 6px 18px rgba(0,0,0,.48);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    transition:
        transform .3s ease,
        opacity .3s ease,
        box-shadow .3s ease;
}

#music-button img{
    display:block;
    width:100%;
    height:100%;

    object-fit:cover;

    pointer-events:none;
    user-select:none;
}

#music-button:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 18px rgba(255,100,100,.42),
        0 0 38px rgba(180,20,35,.28),
        0 8px 22px rgba(0,0,0,.52);
}

#music-button.is-playing{
    animation:musicPulse 2.4s ease-in-out infinite;
}

#music-button.is-muted{
    opacity:.48;
    animation:none;
}

@keyframes musicPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 14px rgba(255,90,90,.28),
            0 0 28px rgba(180,20,35,.18),
            0 6px 18px rgba(0,0,0,.48);
    }

    50%{
        transform:scale(1.06);
        box-shadow:
            0 0 22px rgba(255,110,110,.48),
            0 0 44px rgba(190,25,40,.32),
            0 7px 20px rgba(0,0,0,.52);
    }
}

@media(max-width:700px){
    #music-button{
        width:48px;
        height:48px;
    }
}

#polaroid-layer{
    display:block;
    opacity:1;
    visibility:visible;
}

.polaroid{
    display:block;
    opacity:1;
    visibility:visible;
}


body.beat-pulse #sky{
    filter:
        brightness(2.20)
        drop-shadow(0 0 6px rgba(255,255,255,.72))
        drop-shadow(0 0 11px rgba(255,220,165,.24));
}

body.beat-pulse #memory-aura{
    opacity:.30;
    transform:scale(1.045);
}

#sky{
    transition:filter .10s ease-out;
}


/* ---------- Cute Techy Touches ---------- */

.polaroid-card::before{
    content:"";
    position:absolute;
    inset:-35%;

    z-index:2;
    pointer-events:none;

    background:
        linear-gradient(
            110deg,
            transparent 35%,
            rgba(255,246,220,.10) 43%,
            rgba(255,180,210,.30) 50%,
            rgba(170,215,255,.18) 57%,
            transparent 66%
        );

    opacity:0;
    transform:
        translateX(-120%)
        rotate(12deg);

    transition:
        opacity .35s ease,
        transform .65s ease;
}

.polaroid:hover .polaroid-card::before,
.polaroid:focus-visible .polaroid-card::before{
    opacity:1;

    transform:
        translateX(120%)
        rotate(12deg);
}





/* ---------- Mobile landscape prompt ---------- */
#rotate-phone-prompt{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:
        radial-gradient(circle at 50% 38%,rgba(70,42,78,.30),transparent 42%),
        rgba(2,3,10,.97);
    color:#fff4dc;
    text-align:center;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

#rotate-phone-prompt .rotate-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    max-width:300px;
}

#rotate-phone-prompt .phone-icon{
    position:relative;
    width:72px;
    height:126px;
    border:4px solid currentColor;
    border-radius:15px;
    box-shadow:
        0 0 18px rgba(255,235,200,.30),
        inset 0 0 12px rgba(255,235,200,.08);
    animation:turnPhone 2.1s ease-in-out infinite;
}

#rotate-phone-prompt .phone-icon::before{
    content:"";
    position:absolute;
    top:7px;
    left:50%;
    width:22px;
    height:4px;
    border-radius:999px;
    background:currentColor;
    transform:translateX(-50%);
    opacity:.8;
}

#rotate-phone-prompt .phone-icon::after{
    content:"";
    position:absolute;
    bottom:7px;
    left:50%;
    width:8px;
    height:8px;
    border:2px solid currentColor;
    border-radius:50%;
    transform:translateX(-50%);
    opacity:.75;
}

#rotate-phone-prompt .turn-arrow{
    position:absolute;
    width:118px;
    height:118px;
    border:4px solid transparent;
    border-top-color:#ffe9c5;
    border-right-color:#ffe9c5;
    border-radius:50%;
    filter:drop-shadow(0 0 8px rgba(255,224,177,.45));
    animation:spinArrow 2.1s ease-in-out infinite;
}

#rotate-phone-prompt .turn-arrow::after{
    content:"";
    position:absolute;
    right:-7px;
    top:13px;
    width:16px;
    height:16px;
    border-top:4px solid #ffe9c5;
    border-right:4px solid #ffe9c5;
    transform:rotate(38deg);
}

#rotate-phone-prompt p{
    margin:0;
    font-family:
        "Snell Roundhand",
        "Apple Chancery",
        "Bradley Hand",
        cursive;
    font-size:clamp(24px,7vw,34px);
    line-height:1.25;
    text-shadow:0 0 14px rgba(255,220,175,.35);
}

#rotate-phone-prompt small{
    font-size:14px;
    letter-spacing:.04em;
    color:rgba(255,244,220,.72);
}

@keyframes turnPhone{
    0%,20%,100%{transform:rotate(0deg)}
    55%,78%{transform:rotate(90deg)}
}

@keyframes spinArrow{
    0%,20%,100%{transform:rotate(-35deg);opacity:.65}
    55%,78%{transform:rotate(55deg);opacity:1}
}

@media (max-width:900px) and (orientation:portrait){
    #rotate-phone-prompt{display:flex}
    #scene,
    #music-button{visibility:hidden}
}

@media (orientation:landscape){
    #rotate-phone-prompt{display:none!important}
}

</style>
</head>
<body>

<div id="rotate-phone-prompt" role="status" aria-live="polite">
    <div class="rotate-content">
        <div class="turn-arrow" aria-hidden="true"></div>
        <div class="phone-icon" aria-hidden="true"></div>
        <p>Gira tu teléfono</p>
        <small>Esta sorpresa se ve mejor en horizontal</small>
    </div>
</div>

<main id="scene">
<img id="background" src="background-clean.jpg" alt="" draggable="false">
<canvas id="lake-waves" aria-hidden="true"></canvas>
<div id="moon-halo" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="memory-aura" aria-hidden="true"></div>
<div id="polaroid-layer" aria-label="Our memories"></div>
<div id="memory-dim" aria-hidden="true"></div>
<div id="effect-layer" aria-hidden="true"></div>
<div id="memory-stage">
<div id="memory-card" role="dialog" aria-modal="true" aria-label="Memory"></div>
</div>
</main>

<audio id="background-music" loop preload="auto">
    <source src="./prestame-tu-corazon.mp3" type="audio/mpeg">
</audio>

<button
    id="music-button"
    type="button"
    aria-label="Reproducir o pausar música"
>
    <img
        src="rose-heart-button.PNG"
        alt=""
        draggable="false"
    >
</button>

<script>
"use strict";

const ORIGINAL_WIDTH=1448;
const ORIGINAL_HEIGHT=1086;
const HANGING_OFFSET=45;

/*
 * Rose button location in the original 1448 × 1086 artwork.
 * These coordinates place it beside the bench/couple.
 */
const MUSIC_BUTTON_X=1015;
const MUSIC_BUTTON_Y=895;

const scene=document.querySelector("#scene");
const background=document.querySelector("#background");
const layer=document.querySelector("#polaroid-layer");
const memoryCard=document.querySelector("#memory-card");
const memoryDim=document.querySelector("#memory-dim");
const effectLayer=document.querySelector("#effect-layer");
const backgroundMusic=document.querySelector("#background-music");
const musicButton=document.querySelector("#music-button");
const memories=[
    {
        type:"image",
        file:"memory-1.jpg",
        x:64,
        y:630,
        width:42,
        height:57,
        effect:"shooting",
        caption:"Ojalá pudiera revivir esta memoria."
    },
    {
        type:"image",
        file:"memory-2.jpeg",
        x:126,
        y:586,
        width:42,
        height:57,
        effect:"constellation",
        caption:"No tenías idea de lo hermosa que te veías."
    },
    {
        type:"image",
        file:"memory-3.jpeg",
        x:268,
        y:642,
        width:42,
        height:57,
        effect:"develop",
        caption:"El día que sentí como si fuéramos una familia."
    },
    {
        type:"image",
        file:"memory-4.jpeg",
        x:323,
        y:611,
        width:42,
        height:57,
        effect:"heartbeat",
        caption:"Manejas mi vida, que no manejes mi troca 😂."
    },
    {
        type:"image",
        file:"memory-5.jpeg",
        x:366,
        y:514,
        width:42,
        height:57,
        effect:"moon",
        caption:"Tu sonrisa lo es todo para mí."
    },
    {
        type:"image",
        file:"memory-6.jpeg",
        x:445,
        y:559,
        width:42,
        height:57,
        effect:"stardust",
        caption:"Ojalá pudiéramos congelar el tiempo."
    },
    {
        type:"image",
        file:"memory-7.jpeg",
        x:525,
        y:588,
        width:42,
        height:57,
        effect:"vortex",
        caption:"Todavía puedo escuchar nuestras risas."
    },
    {
        type:"image",
        file:"memory-8.JPG",
        x:584,
        y:548,
        width:42,
        height:57,
        effect:"fireflies",
        caption:"Esa mirada me derrite el corazón."
    },
    {
        type:"video",
        file:"memory-9.mp4",
        x:633,
        y:646,
        width:42,
        height:57,
        effect:"ripple",
        caption:"Esta memoria me sigue haciendo sonreír cada que la veo."
    },
    {
        type:"video",
        file:"memory-10.mp4",
        x:680,
        y:596,
        width:42,
        height:57,
        effect:"stardust",
        caption:"Podría ver este video mil veces."
    }
];

let activeState=null;
let isTransitioning=false;

const polaroids=memories.map((memory,index)=>{
const button=document.createElement("button");
button.className="polaroid";
button.type="button";
button.setAttribute("aria-label",`Open memory ${index+1}`);
const card=document.createElement("span");
card.className="polaroid-card";
let media;
if(memory.type==="video"){
media=document.createElement("video");

media.src=memory.file;
media.poster=memory.file.replace(/\.mp4$/i,"-poster.jpg");
media.muted=true;
media.defaultMuted=true;
media.playsInline=true;
media.preload="metadata";
media.autoplay=false;
media.loop=false;
media.controls=false;

media.setAttribute("muted","");
media.setAttribute("playsinline","");
media.setAttribute("webkit-playsinline","");
}else{
media=document.createElement("img");
media.src=memory.file;
media.alt="";
media.draggable=false;
}
media.className="polaroid-media";
card.appendChild(media);
button.appendChild(card);
layer.appendChild(button);
const state={element:button,memory,phase:Math.random()*Math.PI*2,secondPhase:Math.random()*Math.PI*2,speed:.00035+Math.random()*.00018,swayAmount:2.2+Math.random()*1.8,liftAmount:.6+Math.random()*.7};
button.addEventListener("click",(event)=>{event.stopPropagation();if(!isTransitioning&&!activeState){openMemory(state)}});
return state;
});

function getLayout(){

    const sw = scene.clientWidth;
    const sh = scene.clientHeight;

    const scale = Math.max(
        sw / ORIGINAL_WIDTH,
        sh / ORIGINAL_HEIGHT
    );

    const renderedWidth = ORIGINAL_WIDTH * scale;
    const renderedHeight = ORIGINAL_HEIGHT * scale;

    let offsetX = (sw - renderedWidth) / 2;
    let offsetY = (sh - renderedHeight) / 2;

    // Mobile adjustment
    if(sw < 700){
        offsetY += renderedHeight * 0.18;
    }

    return{
        scale,
        offsetX,
        offsetY
    };

}

function positionPolaroids(){

    const layout=getLayout();

    const isMobile=
        window.innerWidth<=700;

    for(const state of polaroids){

        const m=state.memory;

        const width=
            m.width*
            (isMobile
                ?Math.max(layout.scale,.72)
                :layout.scale);

        const height=
            m.height*
            (isMobile
                ?Math.max(layout.scale,.72)
                :layout.scale);

        const x=
            layout.offsetX+
            m.x*layout.scale;

        const y=
            layout.offsetY+
            m.y*layout.scale+
            HANGING_OFFSET*layout.scale;

        state.element.style.left=
            `${x-(width-m.width*layout.scale)/2}px`;

        state.element.style.top=
            `${y}px`;

        state.element.style.width=
            `${width}px`;

        state.element.style.height=
            `${height}px`;

    }

}

function positionMusicButton(){
    if(!musicButton){
        return;
    }

    const layout=getLayout();
    const isMobile=window.innerWidth<=700;
    const size=isMobile?48:58;

    let centerX=
        layout.offsetX+
        MUSIC_BUTTON_X*layout.scale;

    let centerY=
        layout.offsetY+
        MUSIC_BUTTON_Y*layout.scale;

    /*
     * Keep the rose visible on narrow iPhones even when
     * the artwork is cropped.
     */
    const edgePadding=10;

    centerX=Math.max(
        edgePadding+size/2,
        Math.min(
            window.innerWidth-edgePadding-size/2,
            centerX
        )
    );

    centerY=Math.max(
        edgePadding+size/2,
        Math.min(
            window.innerHeight-edgePadding-size/2,
            centerY
        )
    );

    musicButton.style.width=`${size}px`;
    musicButton.style.height=`${size}px`;
    musicButton.style.left=`${centerX-size/2}px`;
    musicButton.style.top=`${centerY-size/2}px`;
}

function animatePolaroids(time){
for(const state of polaroids){
if(state===activeState){continue}
const rotation=Math.sin(time*state.speed+state.phase)*state.swayAmount;
const secondRotation=Math.sin(time*(state.speed*1.61)+state.secondPhase)*.55;
const verticalMovement=Math.sin(time*(state.speed*.78)+state.phase)*state.liftAmount;
const horizontalMovement=Math.sin(time*(state.speed*.53)+state.secondPhase)*.7;
state.element.style.transform=`translate(${horizontalMovement.toFixed(2)}px,${verticalMovement.toFixed(2)}px) rotate(${(rotation+secondRotation).toFixed(2)}deg)`;

function createMemoryMedia(memory){

    if(memory.type==="video"){

        const video=document.createElement("video");

        video.src=memory.file;
        video.poster=memory.file.replace(/\.mp4$/i,"-poster.jpg");
        video.autoplay=true;
        video.loop=true;
        video.controls=false;
        video.playsInline=true;
        video.preload="auto";
        video.muted=false;
        video.volume=.38;

        video.setAttribute("playsinline","");
        video.setAttribute("webkit-playsinline","");

        const keepBackgroundMusicPlaying=()=>{
            if(
                typeof fadeMusic==="function" &&
                musicStarted &&
                !musicMuted
            ){
                if(backgroundMusic.paused){
                    backgroundMusic.play().catch(()=>{});
                }

                fadeMusic(.04,700);
            }
        };

        video.addEventListener("play",keepBackgroundMusicPlaying);
        video.addEventListener("playing",keepBackgroundMusicPlaying);

        video.addEventListener("pause",()=>{
            if(
                typeof fadeMusic==="function" &&
                musicStarted &&
                !musicMuted
            ){
                fadeMusic(.22,900);
            }
        });

        video.addEventListener("ended",()=>{
            if(
                typeof fadeMusic==="function" &&
                musicStarted &&
                !musicMuted
            ){
                fadeMusic(.22,900);
            }
        });

        return video;
    }

    const image=document.createElement("img");

    image.src=memory.file;
    image.alt="Memory";
    image.draggable=false;

    return image;
}

class Star{
    constructor(layer){
        this.layer=layer;
        this.x=rand(0,width);
        this.y=rand(0,height*.72);
        this.phase=rand(0,Math.PI*2);

        if(layer===0){
            this.r=rand(.22,.62);
            this.base=rand(.025,.10);
            this.range=rand(.018,.055);
            this.speed=rand(.08,.24);
            this.drift=.08;
        }else if(layer===1){
            this.r=rand(.45,1.05);
            this.base=rand(.05,.17);
            this.range=rand(.035,.12);
            this.speed=rand(.18,.55);
            this.drift=.18;
        }else{
            this.r=rand(.9,1.75);
            this.base=rand(.11,.27);
            this.range=rand(.08,.20);
            this.speed=rand(.28,.78);
            this.drift=.34;
        }

        const tintRoll=Math.random();
        this.tint=tintRoll<.018
            ?"215,230,255"
            :tintRoll<.036
                ?"255,230,185"
                :"255,255,255";
    }

    draw(t){
        const open=document.body.classList.contains("memory-open");
        const baseBoost=open?1.34:1.12;

        const driftX=Math.sin(t*.045+this.phase)*this.drift;
        const driftY=Math.cos(t*.038+this.phase)*this.drift*.45;

        const slowTwinkle=Math.sin(t*this.speed+this.phase)*this.range;
        const sparkle=this.layer===2
            ?Math.max(0,Math.sin(t*2.15+this.phase*1.7))*.12
            :0;

        const alpha=Math.max(
            0,
            (this.base+slowTwinkle+sparkle)*baseBoost
        );

        const breathing=
            1+Math.sin(t*.55+this.phase)*.08;

        const sparkle=
            this.layer===2
                ?Math.max(0,Math.sin(t*2.2+this.phase))*.18
                :Math.max(0,Math.sin(t*1.4+this.phase))*.05;

        const pulse=breathing+sparkle;

        ctx.save();
        ctx.beginPath();
        ctx.fillStyle=`rgba(${this.tint},${Math.min(alpha,.96)})`;
        ctx.shadowBlur=this.layer===2
            ?10+Math.max(0,Math.sin(t*1.9+this.phase))*10
            :3+this.layer*3;
        ctx.shadowColor=`rgba(${this.tint},.82)`;
        ctx.arc(
            this.x+driftX+Math.sin(t*.18+this.phase)*0.8,
            this.y+driftY+Math.cos(t*.15+this.phase)*0.5,
            this.r*pulse,
            0,
            Math.PI*2
        );
        ctx.fill();

        if(this.layer===2&&alpha>.28){
            const ray=this.r*4.2;
            ctx.globalAlpha=Math.min(.24,alpha*.28);
            ctx.strokeStyle=`rgba(${this.tint},.8)`;
            ctx.lineWidth=.55;
            ctx.beginPath();
            ctx.moveTo(this.x-ray,this.y);
            ctx.lineTo(this.x+ray,this.y);
            ctx.moveTo(this.x,this.y-ray);
            ctx.lineTo(this.x,this.y+ray);
            ctx.stroke();
        }

        ctx.restore();
    }
}

class Meteor{
    constructor(){
        this.x=rand(width*.05,width*.78);
        this.y=rand(height*.03,height*.24);
        this.angle=Math.PI/4+rand(-.14,.12);
        this.speed=rand(560,840);
        this.length=rand(95,190);
        this.age=0;
        this.life=rand(.85,1.28);
    }

    update(dt){
        this.age+=dt;
        this.x+=Math.cos(this.angle)*this.speed*dt;
        this.y+=Math.sin(this.angle)*this.speed*dt;
    }

    draw(){
        const a=Math.max(0,1-this.age/this.life);
        const tailX=this.x-Math.cos(this.angle)*this.length;
        const tailY=this.y-Math.sin(this.angle)*this.length;
        const gradient=ctx.createLinearGradient(this.x,this.y,tailX,tailY);

        gradient.addColorStop(0,`rgba(255,255,255,${a*.95})`);
        gradient.addColorStop(.22,`rgba(255,235,200,${a*.56})`);
        gradient.addColorStop(1,"rgba(255,235,200,0)");

        ctx.save();
        ctx.lineWidth=1.4;
        ctx.strokeStyle=gradient;
        ctx.shadowBlur=12;
        ctx.shadowColor="rgba(255,255,255,.72)";
        ctx.beginPath();
        ctx.moveTo(this.x,this.y);
        ctx.lineTo(tailX,tailY);
        ctx.stroke();
        ctx.restore();
    }

    get done(){
        return this.age>=this.life;
    }
}

class DustParticle{
    constructor(){
        this.x=rand(width*.08,width*.92);
        this.y=rand(height*.30,height*.70);
        this.r=rand(.6,1.7);
        this.phase=rand(0,Math.PI*2);
        this.age=0;
        this.life=rand(3.8,6.6);
        this.vx=rand(-4,4);
        this.vy=rand(-13,-6);
    }

    update(dt){
        this.age+=dt;
        this.x+=this.vx*dt;
        this.y+=this.vy*dt;
    }

    draw(t){
        const p=this.age/this.life;
        const alpha=Math.sin(Math.PI*Math.min(1,p))*.23;
        ctx.save();
        ctx.fillStyle=`rgba(255,235,205,${alpha})`;
        ctx.shadowBlur=8;
        ctx.shadowColor="rgba(255,225,185,.4)";
        ctx.beginPath();
        ctx.arc(
            this.x+Math.sin(t*.9+this.phase)*4,
            this.y,
            this.r,
            0,
            Math.PI*2
        );
        ctx.fill();
        ctx.restore();
    }

    get done(){
        return this.age>=this.life;
    }
}

function buildStars(){

    const total=Math.min(
        460,
        Math.max(190,Math.floor(width*height/3000))
    );

    for(let i=0;i<total;i+=1){
        const roll=Math.random();
        const layer=roll<.68?0:roll<.93?1:2;
        stars.push(new Star(layer));
    }
}

function spawnDustBurst(){
    const amount=3+Math.floor(Math.random()*4);
    for(let i=0;i<amount;i+=1){
        dust.push(new DustParticle());
    }
}

function buildSecretConstellation(){
    secretStars.length=0;

    const pattern=[
        /* M */
        [-64,-18],[-64,0],[-64,18],[-52,-8],[-40,-18],[-40,0],[-40,18],

        /* + */
        [-16,0],[-4,0],[8,0],[-4,-12],[-4,12],

        /* L */
        [30,-18],[30,0],[30,18],[44,18],[58,18]
    ];

    const centerX=width*.72;
    const centerY=height*.22;

    pattern.forEach(([x,y],index)=>{
        secretStars.push({
            x:centerX+x,
            y:centerY+y,
            delay:index*.055
        });
    });
}

function drawSecretConstellation(now){
    if(!secretStars.length){
        return;
    }

    const elapsed=(now-secretStars.started)/1000;
    const duration=7;

    if(elapsed>=duration){
        secretStars.length=0;
        nextSecretAt=now+120000+Math.random()*120000;
        return;
    }

    const fadeIn=Math.min(1,elapsed/1.8);
    const fadeOut=Math.min(1,(duration-elapsed)/1.8);
    const alpha=Math.min(fadeIn,fadeOut)*.72;

    ctx.save();
    ctx.strokeStyle=`rgba(255,238,205,${alpha*.22})`;
    ctx.lineWidth=.7;

    for(let i=1;i<secretStars.length;i+=1){
        const previous=secretStars[i-1];
        const current=secretStars[i];

        if(Math.hypot(current.x-previous.x,current.y-previous.y)<28){
            ctx.beginPath();
            ctx.moveTo(previous.x,previous.y);
            ctx.lineTo(current.x,current.y);
            ctx.stroke();
        }
    }

    for(const star of secretStars){
        const local=Math.max(0,elapsed-star.delay);
        const starAlpha=Math.min(1,local*2.4)*alpha;

        ctx.beginPath();
        ctx.fillStyle=`rgba(255,248,225,${starAlpha})`;
        ctx.shadowBlur=10;
        ctx.shadowColor="rgba(255,230,195,.75)";
        ctx.arc(star.x,star.y,1.65,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function resizeCanvas(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    width=window.innerWidth;
    height=window.innerHeight;

    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(height*dpr);
    canvas.style.width=`${width}px`;
    canvas.style.height=`${height}px`;

    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildStars();
    positionMoonHalo();
}

function animateSky(now){
    const dt=Math.min((now-last)/1000,.05);
    const t=now/1000;
    last=now;

    ctx.clearRect(0,0,width,height);
    for(const star of stars){
        star.draw(t);
    }

    nextMeteor-=dt;

    if(nextMeteor<=0&&meteors.length<2){
        meteors.push(new Meteor());

        if(Math.random()<.16){
            window.setTimeout(()=>{
                if(meteors.length<2){
                    meteors.push(new Meteor());
                }
            },450+Math.random()*650);
        }

        nextMeteor=14+Math.random()*26;
    }

    for(let i=meteors.length-1;i>=0;i-=1){
        const meteor=meteors[i];
        meteor.update(dt);
        meteor.draw();

        if(meteor.done){
            meteors.splice(i,1);
        }
    }

    nextDustBurst-=dt;

    if(nextDustBurst<=0&&dust.length<18){
        spawnDustBurst();
        nextDustBurst=3+Math.random()*6;
    }

    for(let i=dust.length-1;i>=0;i-=1){
        const particle=dust[i];
        particle.update(dt);
        particle.draw(t);

        if(particle.done){
            dust.splice(i,1);
        }
    }

    if(now>=nextSecretAt&&!secretStars.length){
        buildSecretConstellation();
        secretStars.started=now;
    }

    drawSecretConstellation(now);
    requestAnimationFrame(animateSky);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();
requestAnimationFrame(animateSky);
let musicStarted=false;
let musicMuted=false;
let musicFadeFrame=null;

let audioContext=null;
let analyser=null;
let audioSource=null;
let beatData=null;
let beatFrame=null;
let beatAverage=0;
let lastBeatTime=0;

function fadeMusic(targetVolume,duration=1200){
    if(!backgroundMusic){
        return;
    }

    if(musicFadeFrame){
        cancelAnimationFrame(musicFadeFrame);
    }

    const startVolume=backgroundMusic.volume;
    const startTime=performance.now();

    function updateVolume(now){
        const progress=Math.min((now-startTime)/duration,1);
        const eased=1-Math.pow(1-progress,3);

        backgroundMusic.volume=
            startVolume+
            (targetVolume-startVolume)*eased;

        if(progress<1){
            musicFadeFrame=requestAnimationFrame(updateVolume);
        }
    }

    musicFadeFrame=requestAnimationFrame(updateVolume);
}


function setupBeatDetection(){
    if(audioContext){
        return;
    }

    const AudioContextClass=
        window.AudioContext||
        window.webkitAudioContext;

    if(!AudioContextClass){
        return;
    }

    audioContext=new AudioContextClass();

    analyser=audioContext.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=.72;

    beatData=
        new Uint8Array(
            analyser.frequencyBinCount
        );

    audioSource=
        audioContext.createMediaElementSource(
            backgroundMusic
        );

    audioSource.connect(analyser);
    analyser.connect(audioContext.destination);
}

function startBeatAnimation(){
    if(!analyser||beatFrame){
        return;
    }

    function detectBeat(now){
        analyser.getByteFrequencyData(beatData);

        /*
         * Bass boost: extra weight on the lowest frequencies
         * so the stars react harder to the song's beat.
         */
        const bassBins=Math.min(45,beatData.length);
        let total=.5;
        let totalWeight=.5;

        for(let index=0;index<bassBins;index+=1){
            const weight=
                1+
                ((bassBins-index)/bassBins)*2.25;

            total+=beatData[index]*weight;
            totalWeight+=weight;
        }

        const rawBass=total/totalWeight;
        const bassLevel=rawBass*1.18;

        beatAverage=
            beatAverage*.90+
            bassLevel*.10;

        const threshold=
            Math.max(76,beatAverage*1.07);

        const enoughTimePassed=
            now-lastBeatTime>180;

        if(
            bassLevel>threshold&&
            enoughTimePassed&&
            !musicMuted
        ){
            lastBeatTime=now;

            document.body.classList.add(
                "beat-pulse"
            );

            window.setTimeout(()=>{
                document.body.classList.remove(
                    "beat-pulse"
                );
            },95);
        }

        beatFrame=
            requestAnimationFrame(
                detectBeat
            );
    }

    beatFrame=
        requestAnimationFrame(
            detectBeat
        );
}

function stopBeatAnimation(){
    if(beatFrame){
        cancelAnimationFrame(beatFrame);
        beatFrame=null;
    }

    document.body.classList.remove(
        "beat-pulse"
    );
}

async function startMusic(){
    if(!backgroundMusic||!musicButton){
        return;
    }

    try{
        backgroundMusic.volume=0;

        setupBeatDetection();

        if(
            audioContext&&
            audioContext.state==="suspended"
        ){
            await audioContext.resume();
        }

        await backgroundMusic.play();

        startBeatAnimation();

        musicStarted=true;
        musicMuted=false;

        musicButton.classList.add("is-playing");
        musicButton.classList.remove("is-muted");

        fadeMusic(.22,1800);
    }catch(error){
        musicButton.classList.remove("is-playing");
        musicButton.classList.add("is-muted");

        console.error(
            "Could not play ./prestame-tu-corazon.mp3. Confirm the exact file is beside index.html.",
            error
        );
    }
}

function toggleMusic(){
    if(!musicStarted){
        startMusic();
        return;
    }

    musicMuted=!musicMuted;

    if(musicMuted){
        fadeMusic(0,450);

        window.setTimeout(()=>{
            if(musicMuted){
                backgroundMusic.pause();
            }
        },480);

        musicButton.classList.remove("is-playing");
        musicButton.classList.add("is-muted");
        stopBeatAnimation();
        return;
    }

    backgroundMusic.play()
        .then(()=>{
            if(
                audioContext&&
                audioContext.state==="suspended"
            ){
                audioContext.resume().catch(()=>{});
            }

            startBeatAnimation();
            fadeMusic(.22,850);
            musicButton.classList.add("is-playing");
            musicButton.classList.remove("is-muted");
        })
        .catch((error)=>{
            console.error("Music could not resume.",error);
        });
}

if(backgroundMusic&&musicButton){
    musicButton.addEventListener("click",(event)=>{
        event.preventDefault();
        event.stopPropagation();
        toggleMusic();
    });

    backgroundMusic.addEventListener("error",()=>{
        musicButton.classList.add("is-muted");

        console.error(
            "Audio file failed to load: ./prestame-tu-corazon.mp3"
        );
    });

    positionMusicButton();
}
</script>
