
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M + L 🌙</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="sky"></canvas>


<div class="scene">


    <!-- Moon -->

    <div class="moon">

        <div class="moon-glow"></div>

    </div>



    <!-- Tree -->

    <div class="tree">

        <div class="trunk"></div>

        <div class="leaves leaf1"></div>
        <div class="leaves leaf2"></div>
        <div class="leaves leaf3"></div>
        <div class="leaves leaf4"></div>

    </div>



    <!-- Lake -->

    <div class="lake">

        <div class="reflection"></div>

    </div>




    <!-- Bench -->

    <div class="bench">

        <div class="seat"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>


    </div>



    <!-- Couple -->

    <div class="couple">


        <!-- You -->

        <div class="person you">

            <div class="head"></div>

            <div class="body"></div>

        </div>




        <!-- Girlfriend -->

        <div class="person girl">


            <div class="hair">

            </div>


            <div class="head"></div>


            <div class="body"></div>


        </div>



    </div>




    <!-- Constellation Text -->

    <div id="love">

        M + L

    </div>



</div>


<script src="script.js"></script>


</body>

</html>
