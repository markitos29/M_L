<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Night</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:system-ui,sans-serif;
}

#scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    user-select:none;
    pointer-events:none;
    -webkit-user-drag:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}



/* ---------- Polaroid Hotspots ---------- */
.polaroid{
position:absolute;
width:68px;
height:92px;
z-index:50;
cursor:pointer;
transform-origin:50% 0%;
will-change:transform;
background:rgba(255,0,0,.12); /* change to transparent after alignment */
}
.p1{left:40%;top:8%;}
.p2{left:44%;top:7%;}
.p3{left:48%;top:8%;}
.p4{left:52%;top:9%;}
.p5{left:56%;top:10%;}
.p6{left:60%;top:11%;}
.p7{left:64%;top:12%;}
.p8{left:68%;top:13%;}
.p9{left:72%;top:14%;}
.p10{left:76%;top:15%;}

</style>
</head>

<body>

<div id="scene">

<img
    id="background"
    src="./14E3A3B9-4C34-479F-BCA4-D1DA57F724B9.png"
    alt="Background"
>
<div class="polaroid p1"></div>
<div class="polaroid p2"></div>
<div class="polaroid p3"></div>
<div class="polaroid p4"></div>
<div class="polaroid p5"></div>
<div class="polaroid p6"></div>
<div class="polaroid p7"></div>
<div class="polaroid p8"></div>
<div class="polaroid p9"></div>
<div class="polaroid p10"></div>
<canvas id="canvas"></canvas>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h,dpr;

function resize(){

    dpr=Math.min(window.devicePixelRatio||1,2);

    w=window.innerWidth;
    h=window.innerHeight;

    canvas.width=w*dpr;
    canvas.height=h*dpr;

    canvas.style.width=w+"px";
    canvas.style.height=h+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

}

window.addEventListener("resize",resize);

resize();

function rand(a,b){
    return Math.random()*(b-a)+a;
}

const stars=[];

class Star{

    constructor(){

        this.x=rand(0,w);
        this.y=rand(0,h*.72);

        this.size=rand(.4,1.3);

        this.alpha=rand(.05,.25);

        this.phase=Math.random()*Math.PI*2;

        this.speed=rand(.15,.7);

        this.glow=rand(2,7);

        this.grow=rand(.08,.25);

    }

    draw(t){

        const a=this.alpha+
        Math.sin(t*this.speed+this.phase)*.18;

        const r=this.size+
        Math.sin(t*this.grow+this.phase)*.18;

        ctx.beginPath();

        ctx.fillStyle=`rgba(255,255,255,${Math.max(a,0)})`;

        ctx.shadowBlur=this.glow;

        ctx.shadowColor="white";

        ctx.arc(
            this.x,
            this.y,
            Math.max(.2,r),
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

    }

}

function buildStars(){

    stars.length=0;

    for(let i=0;i<420;i++){

        stars.push(new Star());

    }

}

buildStars();
    function drawStars(time){

    for(const star of stars){
        star.draw(time);
    }

}

const shootingStars=[];

class ShootingStar{

    constructor(){

        this.reset();

    }

    reset(){

        this.x=rand(w*0.1,w*0.9);

        this.y=rand(20,h*0.35);

        this.length=rand(120,220);

        this.speed=rand(700,1000);

        this.life=0;

        this.maxLife=rand(0.9,1.4);

        this.angle=Math.PI/4+rand(-0.12,0.12);

    }

    update(dt){

        this.life+=dt;

        this.x+=Math.cos(this.angle)*this.speed*dt;
        this.y+=Math.sin(this.angle)*this.speed*dt;

    }

    draw(){

        const alpha=Math.max(0,1-this.life/this.maxLife);

        ctx.save();

        ctx.globalAlpha=alpha;

        ctx.lineWidth=2;

        ctx.strokeStyle="rgba(255,255,255,.9)";

        ctx.shadowBlur=12;

        ctx.shadowColor="white";

        ctx.beginPath();

        ctx.moveTo(this.x,this.y);

        ctx.lineTo(
            this.x-Math.cos(this.angle)*this.length,
            this.y-Math.sin(this.angle)*this.length
        );

        ctx.stroke();

        ctx.restore();

    }

    get dead(){

        return this.life>=this.maxLife;

    }

}

let nextMeteor=rand(8,20);

let last=performance.now();

function animate(now){

    const dt=(now-last)/1000;

    last=now;

    ctx.clearRect(0,0,w,h);

    const t=now*0.001;

    drawStars(t);

    updateConstellations(dt);
drawConstellations();

    nextMeteor-=dt;

    if(nextMeteor<=0 && shootingStars.length<2){

        shootingStars.push(new ShootingStar());

        nextMeteor=rand(8,20);

    }

    for(let i=shootingStars.length-1;i>=0;i--){

        const s=shootingStars[i];

        s.update(dt);

        s.draw();

        if(s.dead){

            shootingStars.splice(i,1);

        }

    }

    

// ---------- Polaroid Motion ----------
const photos=[...document.querySelectorAll('.polaroid')];
const states=photos.map(()=>({
 angle:(Math.random()-0.5)*4,
 vel:0,
 seed:Math.random()*1000
}));
let mx=-9999,my=-9999;
window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
window.addEventListener('mouseleave',()=>{mx=my=-9999;});
function animatePolaroids(time){
 photos.forEach((p,i)=>{
   const s=states[i];
   const r=p.getBoundingClientRect();
   const cx=r.left+r.width/2;
   const dx=mx-cx;
   const dist=Math.abs(dx);
   if(dist<180) s.vel+=(-dx)*0.0008;
   s.vel+=Math.sin(time*0.00025+s.seed)*0.02;
   s.vel+=(-s.angle)*0.03;
   s.vel*=0.985;
   s.angle+=s.vel;
   const bob=Math.sin(time*0.0015+s.seed)*2;
   p.style.transform=`translateY(${bob}px) rotate(${s.angle}deg)`;
 });
 requestAnimationFrame(animatePolaroids);
}
requestAnimationFrame(animatePolaroids);

requestAnimationFrame(animate);

}
// ------------------------
// Constellations
// ------------------------

let constellationTimer = rand(20, 40);
let constellationAlpha = 0;
let constellationVisible = false;
let constellationHold = 0;
let constellation = [];

function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function createRandomConstellation() {

    constellation = [];

    const start = stars[Math.floor(rand(0, stars.length))];

    constellation.push(start);

    let current = start;

    for (let i = 0; i < 5; i++) {

        let nearest = null;
        let best = 999999;

        for (const star of stars) {

            if (constellation.includes(star)) continue;

            const d = distance(current, star);

            if (d < best && d < 140) {
                best = d;
                nearest = star;
            }

        }

        if (!nearest) break;

        constellation.push(nearest);
        current = nearest;

    }

}

function createMLConstellation() {

    const x = rand(w * 0.15, w * 0.55);
    const y = rand(h * 0.10, h * 0.30);

    constellation = [

        { x:x, y:y },
        { x:x+12, y:y+30 },
        { x:x+24, y:y },
        { x:x+36, y:y+30 },
        { x:x+48, y:y },

        { x:x+65, y:y+15 },

        { x:x+82, y:y },
        { x:x+82, y:y+30 },
        { x:x+106, y:y+30 }

    ];

}

function updateConstellations(dt){

    constellationTimer -= dt;

    if(!constellationVisible && constellationTimer <= 0){

        if(Math.random() < 0.40){

            createMLConstellation();

        }else{

            createRandomConstellation();

        }

        constellationVisible = true;
        constellationAlpha = 0;
        constellationHold = rand(3,5);

        constellationTimer = rand(15,30);

    }

    if(constellationVisible){

        if(constellationAlpha < 1 && constellationHold > 2.5){

            constellationAlpha += dt * 0.5;

        }

        constellationHold -= dt;

        if(constellationHold <= 0){

            constellationAlpha -= dt * 0.5;

            if(constellationAlpha <= 0){

                constellationVisible = false;

                constellation = [];

            }

        }

    }

}

function drawConstellations(){

    if(!constellationVisible || constellation.length < 2) return;

    ctx.save();

    ctx.globalAlpha = constellationAlpha * 0.45;

    ctx.strokeStyle = "white";

    ctx.lineWidth = 1;

    ctx.shadowBlur = 8;

    ctx.shadowColor = "white";

    ctx.beginPath();

    for(let i=0;i<constellation.length-1;i++){

        ctx.moveTo(
            constellation[i].x,
            constellation[i].y
        );

        ctx.lineTo(
            constellation[i+1].x,
            constellation[i+1].y
        );

    }

    ctx.stroke();

    ctx.restore();

}
requestAnimationFrame(animate);
    </script>

</body>
</html>
