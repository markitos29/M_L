<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Night Garden</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at 70% 15%, rgba(50,50,90,.18), transparent 35%),
linear-gradient(
180deg,
#010107 0%,
#030314 50%,
#000005 100%
);

}


/* Moon */

.moon{

position:absolute;

top:80px;
right:110px;

width:135px;
height:135px;

border-radius:50%;

background:

radial-gradient(
circle at 35% 35%,
#d8d8d8,
#999 60%,
#666
);


box-shadow:

0 0 25px rgba(220,220,255,.35),
0 0 70px rgba(150,150,220,.15);

opacity:.85;

}


/* Moon details */

.moon::before{

content:"";

position:absolute;

width:20px;
height:20px;

background:#777;

border-radius:50%;

top:35px;
left:30px;

opacity:.4;


box-shadow:

45px 20px 0 6px #777,
30px 70px 0 4px #555;

}



/* Stars */

.star{

position:absolute;

background:white;

border-radius:50%;

opacity:.4;

}


.star.glow{

opacity:.9;

box-shadow:

0 0 5px white,
0 0 10px white;

animation:twinkle 4s infinite;

}



@keyframes twinkle{

0%,100%{
opacity:.3;
}

50%{
opacity:1;
}

}



/* Real meteor */

.shooting{


position:absolute;

width:120px;

height:2px;


background:

linear-gradient(
90deg,
rgba(255,255,255,0),
white
);


filter:
drop-shadow(0 0 8px white);


transform:
rotate(-45deg);


animation:
meteor 5s linear infinite;


opacity:0;


}



.shooting::after{

content:"";

position:absolute;

right:0;

top:-2px;

width:6px;

height:6px;

background:white;

border-radius:50%;

box-shadow:
0 0 15px white;

}



@keyframes meteor{


0%{

top:-20%;
left:110%;

opacity:0;

}


10%{

opacity:1;

}


35%{

top:45%;
left:55%;

opacity:0;

}


100%{

opacity:0;

}

}



/* Rose petals */


.petal{

position:absolute;

width:10px;

height:14px;

background:#750027;

border-radius:
100% 0 100% 0;


opacity:.55;


filter:
drop-shadow(0 0 3px #8b0030);


animation:
fall linear infinite;


}



@keyframes fall{


0%{

transform:
translateY(-10vh)
rotate(0deg);

}


100%{

transform:
translateY(110vh)
translateX(40px)
rotate(450deg);

}


}



</style>

</head>


<body>


<div class="moon"></div>


<script>


// Stars

for(let i=0;i<250;i++){


let star=document.createElement("div");

star.className="star";


let size=Math.random()*2+0.5;


star.style.width=size+"px";
star.style.height=size+"px";


star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";



if(Math.random()>.8){

star.classList.add("glow");

star.style.animationDelay=
Math.random()*5+"s";

}


document.body.appendChild(star);


}



// Meteors

function createMeteor(){


let meteor=document.createElement("div");

meteor.className="shooting";


meteor.style.top=
Math.random()*30+"vh";


meteor.style.left=
Math.random()*80+"vw";


meteor.style.animationDuration=
(Math.random()*3+4)+"s";


document.body.appendChild(meteor);



setTimeout(()=>{

meteor.remove();

},5000);


}


setInterval(createMeteor,4500);



// Less rose petals

for(let i=0;i<15;i++){


let petal=document.createElement("div");

petal.className="petal";


petal.style.left=
Math.random()*100+"vw";


petal.style.animationDuration=
(Math.random()*10+12)+"s";


petal.style.animationDelay=
Math.random()*15+"s";


document.body.appendChild(petal);


}


</script>


</body>
</html>
