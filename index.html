<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuestras Memorias</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
    font:inherit;
}

#scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    isolation:isolate;
}

#background{
    position:absolute;
    inset:0;
    z-index:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    transition:
        filter 1.25s cubic-bezier(.22,.61,.36,1),
        transform 1.25s cubic-bezier(.22,.61,.36,1);
}

#sky{
    position:absolute;
    inset:0;
    z-index:1;
    width:100%;
    height:100%;
    pointer-events:none;
    transition:
        filter 1.25s ease,
        opacity 1.25s ease;
}

#memory-aura{
    position:absolute;
    inset:-20%;
    z-index:2;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,244,210,.22) 0%,
            rgba(255,229,182,.10) 22%,
            rgba(255,255,255,0) 58%
        );
    filter:blur(28px);
    transform:scale(.9);
    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

#polaroid-layer{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
}

.polaroid{
    position:absolute;
    width:42px;
    height:57px;
    border:0;
    padding:0;
    background:transparent;
    cursor:pointer;
    pointer-events:auto;
    transform-origin:50% 0%;
    will-change:transform;
    appearance:none;
    -webkit-appearance:none;
}

.polaroid-card{
    position:absolute;
    inset:0;
    display:block;
    overflow:hidden;

    padding:3px 3px 10px;

    /* Warm vintage paper */
    background:#F4EFE5;

    /* Soft ivory edge */
    border:1px solid rgba(238,232,219,.90);

    /* Makes the edge catch the light */
    outline:1px solid rgba(255,248,236,.22);
    outline-offset:-1px;

    /* Warm moonlight glow */
    box-shadow:
        0 0 2px rgba(255,248,230,.18),
        0 0 8px rgba(255,233,190,.15),
        0 0 18px rgba(255,223,170,.10),
        0 4px 10px rgba(0,0,0,.40);

    filter:brightness(1);

    transition:
        transform .45s ease,
        box-shadow .45s ease,
        filter .45s ease;
}

.polaroid-media{
    display:block;
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    object-fit:cover;
    pointer-events:none;
    background:#151515;
}

.polaroid:hover .polaroid-card,
.polaroid:focus-visible .polaroid-card{

    box-shadow:
        0 0 5px rgba(255,249,235,.35),
        0 0 14px rgba(255,233,190,.25),
        0 0 26px rgba(255,223,170,.18),
        0 8px 16px rgba(0,0,0,.45);

    filter:brightness(1.04);

    transform:translateY(-2px) scale(1.02);
}

.polaroid:focus-visible{
    outline:none;
}

.polaroid.is-origin-hidden .polaroid-card{
    opacity:0;
}

#memory-dim{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            circle at center,
            rgba(3,5,12,.16) 0%,
            rgba(0,0,0,.48) 64%,
            rgba(0,0,0,.70) 100%
        );
    transition:opacity 1.1s ease;
}

#memory-particles{
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    overflow:hidden;
    opacity:0;
    transition:opacity .8s ease;
}

.memory-particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(255,248,226,.92);
    box-shadow:0 0 8px rgba(255,235,190,.75);
    animation:memoryDust var(--duration) ease-in-out infinite;
    animation-delay:var(--delay);
}

@keyframes memoryDust{
    0%,100%{
        transform:translate3d(0,10px,0) scale(.75);
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    50%{
        transform:translate3d(var(--drift),-22px,0) scale(1.2);
        opacity:1;
    }

    80%{
        opacity:.35;
    }
}

#memory-stage{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:none;
}

#memory-card{
    position:absolute;
    left:0;
    top:0;
    display:none;

    width:42px;
    height:57px;

    padding:0;

    border:1px solid rgba(255,242,215,.45);
    border-radius:18px;

    background:rgba(8,10,16,.88);

    box-shadow:
        0 0 18px rgba(255,240,205,.34),
        0 0 55px rgba(255,222,170,.20),
        0 24px 65px rgba(0,0,0,.58);

    transform-origin:center;

    will-change:
        transform,
        width,
        height,
        left,
        top;

    pointer-events:auto;
    cursor:zoom-out;

    overflow:hidden;
}

#memory-card.is-active{
    display:block;
}

#memory-card img,
#memory-card video{
    display:block;
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    background:#090b12;

    filter:
        brightness(.94)
        contrast(1.02)
        saturate(.92);
}

    #memory-card::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    border-radius:inherit;

    background:
        linear-gradient(
            to bottom,
            rgba(5,8,16,.16),
            transparent 22%,
            transparent 72%,
            rgba(4,6,12,.28)
        );

    box-shadow:
        inset 0 0 40px rgba(5,8,16,.38);
}

#memory-close{
    position:absolute;
    top:14px;
    right:14px;
    z-index:9;
    display:none;
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;
    color:#fff;
    background:rgba(8,10,18,.42);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    cursor:pointer;
    opacity:0;
    transform:scale(.85);
    transition:
        opacity .35s ease,
        transform .35s ease,
        background .25s ease;
}

#memory-close:hover{
    background:rgba(20,22,32,.68);
}

#memory-close.is-visible{
    display:block;
    opacity:1;
    transform:scale(1);
}

body.memory-open #background{
    filter:blur(1.5px) brightness(.72) saturate(.92);
    transform:scale(1.000);
}

body.memory-open #sky{
    z-index:8;

    filter:
        brightness(1.8)
        drop-shadow(0 0 3px rgba(255,255,255,.5));
}

body.memory-open #memory-aura{
    opacity:1;
    transform:scale(1);
}

body.memory-open #memory-dim{
    opacity:1;
}

body.memory-open #memory-particles{
    opacity:1;
}

@media (max-width:700px){
    #memory-close{
        top:max(12px,env(safe-area-inset-top));
        right:12px;
    }
}

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
    }

    .polaroid{
        transform:none !important;
    }
}
    /* Final Polaroid appearance override */
.polaroid .polaroid-card{
    background:#e8dfcf !important;
    border:1px solid rgba(214,199,174,.95) !important;
    outline:1px solid rgba(255,239,211,.18) !important;
    outline-offset:-1px !important;

    box-shadow:
        0 0 5px rgba(255,226,177,.28),
        0 0 12px rgba(221,181,125,.18),
        0 4px 10px rgba(0,0,0,.48) !important;

    filter:
        brightness(.94)
        sepia(.10)
        saturate(.88) !important;

    transition:
        box-shadow .35s ease,
        filter .35s ease,
        transform .35s ease !important;
}

.polaroid:hover .polaroid-card,
.polaroid:focus-visible .polaroid-card{
    background:#ede4d5 !important;

    box-shadow:
        0 0 8px rgba(255,236,204,.55),
        0 0 20px rgba(225,184,126,.32),
        0 7px 14px rgba(0,0,0,.52) !important;

    filter:
        brightness(1)
        sepia(.08)
        saturate(.92) !important;

    transform:translateY(-2px) scale(1.025) !important;
}
</style>
</head>

<body>
<main id="scene">
    <img id="background" src="background-clean.jpg" alt="" draggable="false">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="memory-aura" aria-hidden="true"></div>
    <div id="polaroid-layer" aria-label="Our memories"></div>
    <div id="memory-dim" aria-hidden="true"></div>
    <div id="memory-particles" aria-hidden="true"></div>

    <div id="memory-stage" aria-live="polite">
        <div id="memory-card" role="dialog" aria-modal="true" aria-label="Memory"></div>
        <button id="memory-close" type="button" aria-label="Close memory">✕</button>
    </div>
</main>

<script>
"use strict";

const ORIGINAL_WIDTH=1448;
const ORIGINAL_HEIGHT=1086;
const HANGING_OFFSET=45;

const scene=document.querySelector("#scene");
const background=document.querySelector("#background");
const layer=document.querySelector("#polaroid-layer");
const memoryCard=document.querySelector("#memory-card");
const memoryClose=document.querySelector("#memory-close");
const memoryDim=document.querySelector("#memory-dim");
const particlesLayer=document.querySelector("#memory-particles");

const memories=[
    {file:"memory-1.jpg",x:64,y:630,width:42,height:57},
    {file:"memory-2.jpeg",x:126,y:586,width:42,height:57},
    {file:"memory-3.jpeg",x:268,y:642,width:42,height:57},
    {file:"memory-4.jpeg",x:323,y:611,width:42,height:57},
    {file:"memory-5.jpeg",x:366,y:514,width:42,height:57},
    {file:"memory-6.jpeg",x:445,y:559,width:42,height:57},
    {file:"memory-7.jpeg",x:525,y:588,width:42,height:57},
    {file:"memory-8.JPG",x:584,y:548,width:42,height:57}
];

let activeState=null;
let isTransitioning=false;

const polaroids=memories.map((memory,index)=>{
    const button=document.createElement("button");
    button.className="polaroid";
    button.type="button";
    button.setAttribute("aria-label",`Open memory ${index+1}`);

    const card=document.createElement("span");
    card.className="polaroid-card";

    const image=document.createElement("img");
    image.className="polaroid-media";
    image.src=memory.file;
    image.alt="";
    image.draggable=false;

    card.appendChild(image);
    button.appendChild(card);
    layer.appendChild(button);

    const state={
    element:button,
    memory,
    phase:Math.random()*Math.PI*2,
    secondPhase:Math.random()*Math.PI*2,
    speed:.00035+Math.random()*.00018,
    swayAmount:2.2+Math.random()*1.8,
    liftAmount:.6+Math.random()*.7
};

    button.addEventListener("mouseenter",()=>{
        state.velocity+=Math.random()>.5?.07:-.07;
    });

    button.addEventListener("click",()=>{
        if(!isTransitioning&&!activeState){
            openMemory(state);
        }
    });

    return state;
});

function getLayout(){
    const sceneWidth=scene.clientWidth;
    const sceneHeight=scene.clientHeight;
    const scale=Math.max(
        sceneWidth/ORIGINAL_WIDTH,
        sceneHeight/ORIGINAL_HEIGHT
    );

    return{
        scale,
        offsetX:(sceneWidth-ORIGINAL_WIDTH*scale)/2,
        offsetY:(sceneHeight-ORIGINAL_HEIGHT*scale)/2
    };
}

function positionPolaroids(){
    const layout=getLayout();

    for(const state of polaroids){
        const memory=state.memory;
        const element=state.element;
        const hangingOffset=HANGING_OFFSET*layout.scale;

        element.style.left=
            `${layout.offsetX+memory.x*layout.scale}px`;

        element.style.top=
            `${layout.offsetY+memory.y*layout.scale+hangingOffset}px`;

        element.style.width=
            `${memory.width*layout.scale}px`;

        element.style.height=
            `${memory.height*layout.scale}px`;
    }
}

function animatePolaroids(time){
    for(const state of polaroids){
        if(state===activeState){
            continue;
        }

        const rotation=
            Math.sin(
                time*state.speed+
                state.phase
            )*
            state.swayAmount;

        const secondRotation=
            Math.sin(
                time*(state.speed*1.61)+
                state.secondPhase
            )*
            .55;

        const verticalMovement=
            Math.sin(
                time*(state.speed*.78)+
                state.phase
            )*
            state.liftAmount;

        const horizontalMovement=
            Math.sin(
                time*(state.speed*.53)+
                state.secondPhase
            )*
            .7;

        state.element.style.transform=
            `translate(${horizontalMovement.toFixed(2)}px, `+
            `${verticalMovement.toFixed(2)}px) `+
            `rotate(${(rotation+secondRotation).toFixed(2)}deg)`;
    }

    requestAnimationFrame(animatePolaroids);
}

function buildParticles(){
    particlesLayer.replaceChildren();

    for(let index=0;index<38;index+=1){
        const particle=document.createElement("span");
        particle.className="memory-particle";
        particle.style.left=`${8+Math.random()*84}%`;
        particle.style.top=`${14+Math.random()*72}%`;
        particle.style.setProperty(
            "--duration",
            `${4.5+Math.random()*5}s`
        );
        particle.style.setProperty(
            "--delay",
            `${-Math.random()*7}s`
        );
        particle.style.setProperty(
            "--drift",
            `${-20+Math.random()*40}px`
        );
        particle.style.opacity=
            (.25+Math.random()*.65).toFixed(2);

        particlesLayer.appendChild(particle);
    }
}

function getTargetRect(){
    const screenPadding =
        window.innerWidth < 700 ? 20 : 50;

    const availableWidth =
        window.innerWidth - screenPadding * 2;

    const availableHeight =
        window.innerHeight - screenPadding * 2;

    let width = Math.min(
        availableWidth,
        980
    );

    let height = width * 0.60;

    if(height > availableHeight){
        height = availableHeight;
        width = height / 0.60;
    }

    return{
        left:(window.innerWidth-width)/2,
        top:(window.innerHeight-height)/2,
        width,
        height
    };
}

function setCardRect(rect){
    memoryCard.style.left=`${rect.left}px`;
    memoryCard.style.top=`${rect.top}px`;
    memoryCard.style.width=`${rect.width}px`;
    memoryCard.style.height=`${rect.height}px`;
}

function openMemory(state){
    isTransitioning=true;
    activeState=state;

    const origin=state.element.getBoundingClientRect();
    const target=getTargetRect();

    memoryCard.replaceChildren();

    const image=document.createElement("img");
    image.src=state.memory.file;
    image.alt="Memory";
    image.draggable=false;
    memoryCard.appendChild(image);

    setCardRect(origin);
    memoryCard.classList.add("is-active");
    state.element.classList.add("is-origin-hidden");

    buildParticles();

    requestAnimationFrame(()=>{
        document.body.classList.add("memory-open");

        memoryCard.animate(
            [
                {
                    left:`${origin.left}px`,
                    top:`${origin.top}px`,
                    width:`${origin.width}px`,
                    height:`${origin.height}px`,
                    transform:`rotate(${state.angle}deg) scale(1)`,
                    borderRadius:"0px"
                },
                {
                    offset:.45,
                    transform:"rotate(-1.2deg) scale(1.03)",
                    borderRadius:"2px"
                },
                {
                    left:`${target.left}px`,
                    top:`${target.top}px`,
                    width:`${target.width}px`,
                    height:`${target.height}px`,
                    transform:"rotate(0deg) scale(1)",
                    borderRadius:"3px"
                }
            ],
            {
                duration:1350,
                easing:"cubic-bezier(.18,.84,.25,1)",
                fill:"forwards"
            }
        ).finished.then(()=>{
            setCardRect(target);
            memoryCard.style.transform="none";
            memoryClose.classList.add("is-visible");
            isTransitioning=false;
        });
    });
}

function closeMemory(){
    if(!activeState||isTransitioning){
        return;
    }

    isTransitioning=true;
    memoryClose.classList.remove("is-visible");

    const current=memoryCard.getBoundingClientRect();
    const origin=activeState.element.getBoundingClientRect();

    document.body.classList.remove("memory-open");

    memoryCard.animate(
        [
            {
                left:`${current.left}px`,
                top:`${current.top}px`,
                width:`${current.width}px`,
                height:`${current.height}px`,
                transform:"rotate(0deg) scale(1)",
                opacity:1
            },
            {
                offset:.55,
                transform:"rotate(1deg) scale(.98)",
                opacity:1
            },
            {
                left:`${origin.left}px`,
                top:`${origin.top}px`,
                width:`${origin.width}px`,
                height:`${origin.height}px`,
                transform:`rotate(${activeState.angle}deg) scale(1)`,
                opacity:.95
            }
        ],
        {
            duration:1200,
            easing:"cubic-bezier(.22,.61,.36,1)",
            fill:"forwards"
        }
    ).finished.then(()=>{
        activeState.element.classList.remove("is-origin-hidden");
        memoryCard.classList.remove("is-active");
        memoryCard.replaceChildren();
        memoryCard.removeAttribute("style");
        activeState=null;
        isTransitioning=false;
    });
}

memoryClose.addEventListener("click",closeMemory);
memoryDim.addEventListener("click",closeMemory);
memoryCard.addEventListener("click",closeMemory);

window.addEventListener("keydown",(event)=>{
    if(event.key==="Escape"){
        closeMemory();
    }
});

background.addEventListener("load",positionPolaroids);

window.addEventListener("resize",()=>{
    positionPolaroids();

    if(activeState&&!isTransitioning){
        setCardRect(getTargetRect());
    }
});

if(background.complete){
    positionPolaroids();
}

requestAnimationFrame(animatePolaroids);

const canvas=document.querySelector("#sky");
const context=canvas.getContext("2d",{alpha:true});

let width=0;
let height=0;
let deviceScale=1;
let previousFrame=performance.now();
let nextShootingStar=8+Math.random()*12;

const stars=[];
const shootingStars=[];

function randomBetween(minimum,maximum){
    return Math.random()*(maximum-minimum)+minimum;
}

class Star{
    constructor(){
        this.x=randomBetween(0,width);
        this.y=randomBetween(0,height*.72);
        this.radius=randomBetween(.3,1.15);
        this.baseAlpha=randomBetween(.03,.2);
        this.alphaRange=randomBetween(.04,.16);
        this.phase=randomBetween(0,Math.PI*2);
        this.speed=randomBetween(.16,.65);
    }

    draw(time){
        const memoryOpen=
            document.body.classList.contains("memory-open");

        const memoryBoost=memoryOpen?1.7:1;

        const sparkle=memoryOpen
            ?Math.max(0,Math.sin(time*2.8+this.phase))*.12
            :0;

        const alpha=Math.max(
            0,
            (
                this.baseAlpha+
                Math.sin(time*this.speed+this.phase)*
                this.alphaRange+
                sparkle
            )*
            memoryBoost
        );

        const radius=memoryOpen
            ?this.radius*
                (
                    1+
                    Math.max(
                        0,
                        Math.sin(time*2.2+this.phase)
                    )*
                    .35
                )
            :this.radius;

        context.beginPath();
        context.fillStyle=
            `rgba(255,255,255,${Math.min(alpha,.95)})`;
        context.arc(
            this.x,
            this.y,
            radius,
            0,
            Math.PI*2
        );
        context.fill();
    }
}

class ShootingStar{
    constructor(){
        this.x=randomBetween(width*.1,width*.8);
        this.y=randomBetween(height*.04,height*.28);
        this.angle=
            Math.PI/4+
            randomBetween(-.12,.12);
        this.speed=randomBetween(620,900);
        this.length=randomBetween(90,175);
        this.age=0;
        this.lifetime=randomBetween(.85,1.2);
    }

    update(deltaTime){
        this.age+=deltaTime;
        this.x+=
            Math.cos(this.angle)*
            this.speed*
            deltaTime;
        this.y+=
            Math.sin(this.angle)*
            this.speed*
            deltaTime;
    }

    draw(){
        const alpha=Math.max(
            0,
            1-this.age/this.lifetime
        );

        context.save();
        context.globalAlpha=alpha*.7;
        context.lineWidth=1.5;
        context.strokeStyle=
            "rgba(255,255,255,.9)";
        context.shadowBlur=10;
        context.shadowColor=
            "rgba(255,255,255,.75)";
        context.beginPath();
        context.moveTo(this.x,this.y);
        context.lineTo(
            this.x-
            Math.cos(this.angle)*
            this.length,
            this.y-
            Math.sin(this.angle)*
            this.length
        );
        context.stroke();
        context.restore();
    }

    get finished(){
        return this.age>=this.lifetime;
    }
}

function buildStars(){
    stars.length=0;

    const count=Math.min(
        400,
        Math.max(
            170,
            Math.floor(width*height/3400)
        )
    );

    for(let index=0;index<count;index+=1){
        stars.push(new Star());
    }
}

function resizeCanvas(){
    deviceScale=Math.min(
        window.devicePixelRatio||1,
        2
    );

    width=window.innerWidth;
    height=window.innerHeight;

    canvas.width=Math.round(width*deviceScale);
    canvas.height=Math.round(height*deviceScale);
    canvas.style.width=`${width}px`;
    canvas.style.height=`${height}px`;

    context.setTransform(
        deviceScale,
        0,
        0,
        deviceScale,
        0,
        0
    );

    buildStars();
}

function animateSky(now){
    const deltaTime=Math.min(
        (now-previousFrame)/1000,
        .05
    );

    const time=now/1000;
    previousFrame=now;

    context.clearRect(
        0,
        0,
        width,
        height
    );

    for(const star of stars){
        star.draw(time);
    }

    nextShootingStar-=deltaTime;

    if(
        nextShootingStar<=0&&
        shootingStars.length<2
    ){
        shootingStars.push(
            new ShootingStar()
        );

        nextShootingStar=
            8+Math.random()*12;
    }

    for(
        let index=shootingStars.length-1;
        index>=0;
        index-=1
    ){
        const shootingStar=
            shootingStars[index];

        shootingStar.update(deltaTime);
        shootingStar.draw();

        if(shootingStar.finished){
            shootingStars.splice(index,1);
        }
    }

    requestAnimationFrame(animateSky);
}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();
requestAnimationFrame(animateSky);
</script>
