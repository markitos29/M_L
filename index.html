<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => {
  resize();
  buildStars();
  positionMoon();
  positionGround();
});

// ---------- Sky gradient ----------
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#000308');
  grad.addColorStop(0.5, '#040915');
  grad.addColorStop(1, '#0a1224');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Stars ----------
let stars = [];
function buildStars() {
  stars = [];
  const count = Math.floor((W * H) / 1800);
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let size, baseAlpha, color;
    if (r > 0.985) {
      size = Math.random() * 1.6 + 1.6;
      baseAlpha = Math.random() * 0.3 + 0.7;
      color = Math.random() > 0.5 ? '255,244,224' : '200,220,255';
    } else if (r > 0.9) {
      size = Math.random() * 1.0 + 0.8;
      baseAlpha = Math.random() * 0.4 + 0.5;
      color = '255,255,255';
    } else {
      size = Math.random() * 0.8 + 0.3;
      baseAlpha = Math.random() * 0.5 + 0.2;
      color = '255,255,255';
    }
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size,
      baseAlpha,
      color,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}
buildStars();

function drawStars(time) {
  for (const s of stars) {
    const flicker = Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.35 + 0.65;
    const alpha = s.baseAlpha * flicker;
    if (s.size > 1.3) {
      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 4);
      glow.addColorStop(0, `rgba(${s.color},${alpha * 0.5})`);
      glow.addColorStop(1, `rgba(${s.color},0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.fillStyle = `rgba(${s.color},${alpha})`;
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Moon ----------
let moon = { x: 0, y: 0, r: 0 };
function positionMoon() {
  moon.r = Math.min(W, H) * 0.075;
  moon.x = W * 0.78;
  moon.y = H * 0.22;
}
positionMoon();

const craters = [
  { dx: -0.35, dy: -0.25, r: 0.16 },
  { dx: 0.15, dy: -0.35, r: 0.10 },
  { dx: 0.30, dy: 0.05, r: 0.20 },
  { dx: -0.15, dy: 0.30, r: 0.13 },
  { dx: 0.05, dy: 0.15, r: 0.08 },
  { dx: -0.40, dy: 0.15, r: 0.09 },
  { dx: 0.35, dy: -0.05, r: 0.07 },
  { dx: -0.05, dy: -0.05, r: 0.06 }
];

function drawMoon() {
  const { x, y, r } = moon;

  const glow = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 2);
  glow.addColorStop(0, 'rgba(230,238,255,0.14)');
  glow.addColorStop(1, 'rgba(230,238,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, r * 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();

  const base = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r * 1.15);
  base.addColorStop(0, '#fdfdf5');
  base.addColorStop(0.5, '#e6e6da');
  base.addColorStop(1, '#b9bcc4');
  ctx.fillStyle = base;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);

  for (const c of craters) {
    const cx = x + c.dx * r * 2;
    const cy = y + c.dy * r * 2;
    const cr = c.r * r * 2;
    const craterGrad = ctx.createRadialGradient(
      cx - cr * 0.3, cy - cr * 0.3, cr * 0.1,
      cx, cy, cr
    );
    craterGrad.addColorStop(0, 'rgba(150,150,145,0.55)');
    craterGrad.addColorStop(0.7, 'rgba(120,120,115,0.35)');
    craterGrad.addColorStop(1, 'rgba(120,120,115,0)');
    ctx.fillStyle = craterGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
  }

  const shade = ctx.createRadialGradient(x + r * 0.6, y - r * 0.2, r * 0.1, x + r * 0.6, y - r * 0.2, r * 1.6);
  shade.addColorStop(0, 'rgba(60,60,80,0)');
  shade.addColorStop(1, 'rgba(40,40,65,0.35)');
  ctx.fillStyle = shade;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);

  ctx.restore();
}

// ---------- Ground & Lake ----------
let ground = {};
function positionGround() {
  ground.horizon = H * 0.74;
  ground.lakeEnd = H * 0.9;
}
positionGround();

function drawGround(time) {
  const landGrad = ctx.createLinearGradient(0, ground.horizon - H * 0.05, 0, ground.horizon);
  landGrad.addColorStop(0, '#05060c');
  landGrad.addColorStop(1, '#03040a');
  ctx.fillStyle = landGrad;
  ctx.fillRect(0, ground.horizon - H * 0.05, W, H * 0.05);

  const top = ground.horizon;
  const bottom = ground.lakeEnd;
  const lakeH = bottom - top;

  // base water gradient - deeper, richer teal-to-indigo, lighter near horizon (catching sky glow)
  const lakeGrad = ctx.createLinearGradient(0, top, 0, bottom);
  lakeGrad.addColorStop(0, '#0d1a2e');
  lakeGrad.addColorStop(0.15, '#0a1524');
  lakeGrad.addColorStop(0.6, '#071120');
  lakeGrad.addColorStop(1, '#050c18');
  ctx.fillStyle = lakeGrad;
  ctx.fillRect(0, top, W, lakeH);

  // subtle sky-reflection tint band right at the horizon line
  const skyBand = ctx.createLinearGradient(0, top, 0, top + lakeH * 0.12);
  skyBand.addColorStop(0, 'rgba(60,80,120,0.35)');
  skyBand.addColorStop(1, 'rgba(60,80,120,0)');
  ctx.fillStyle = skyBand;
  ctx.fillRect(0, top, W, lakeH * 0.12);

  // ---- moon reflection: broken vertical shimmer made of many small offset segments ----
  const rx = moon.x;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, top, W, lakeH);
  ctx.clip();

  const segs = 46;
  for (let i = 0; i < segs; i++) {
    const fy = i / segs;
    const y = top + fy * lakeH;
    const segH = lakeH / segs + 1;
    // width of the reflection narrows with depth (perspective) and jitters (water motion)
    const widthAtDepth = moon.r * (1.3 - fy * 0.9);
    const jitter = Math.sin(fy * 26 + time * 1.6) * moon.r * 0.22
                 + Math.sin(fy * 71 - time * 2.3) * moon.r * 0.08;
    const segX = rx + jitter;
    const alpha = (1 - fy) * 0.5 * (0.6 + 0.4 * Math.sin(fy * 40 + time * 3));
    // occasionally break the segment (gaps in reflection from ripples)
    if (Math.sin(fy * 55 + time * 2) > -0.7) {
      const grad = ctx.createLinearGradient(segX - widthAtDepth, y, segX + widthAtDepth, y);
      grad.addColorStop(0, 'rgba(220,232,255,0)');
      grad.addColorStop(0.5, `rgba(225,235,255,${alpha})`);
      grad.addColorStop(1, 'rgba(220,232,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(segX - widthAtDepth, y, widthAtDepth * 2, segH);
    }
  }
  ctx.restore();

  // ---- ambient starlight speckle on water (tiny flickering dots) ----
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, top, W, lakeH);
  ctx.clip();
  for (let i = 0; i < 40; i++) {
    const sx = (i * 97 + Math.sin(i) * 40) % W;
    const fy = ((i * 53) % 100) / 100;
    const sy = top + fy * lakeH;
    const tw = Math.sin(time * 2 + i) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(200,215,240,${0.05 + tw * 0.08})`;
    ctx.fillRect(sx, sy, 1.4, 1.4);
  }
  ctx.restore();

  // ---- horizontal ripple lines with varying opacity and gentle drift ----
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, top, W, lakeH);
  ctx.clip();
  const rippleRows = 22;
  for (let i = 0; i < rippleRows; i++) {
    const fy = (i + 1) / (rippleRows + 1);
    const ly = top + fy * lakeH;
    const alpha = 0.05 + (1 - fy) * 0.05;
    ctx.strokeStyle = `rgba(190,205,230,${alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const step = 14;
    for (let x = -step; x <= W + step; x += step) {
      const yy = ly + Math.sin(x * 0.03 + time * 1.2 + i * 1.3) * (1.2 + fy * 1.5)
                     + Math.sin(x * 0.011 - time * 0.6 + i) * (2 - fy);
      if (x === -step) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.restore();

  // foreground grass/ground
  const grassGrad = ctx.createLinearGradient(0, ground.lakeEnd, 0, H);
  grassGrad.addColorStop(0, '#04070a');
  grassGrad.addColorStop(1, '#010203');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, ground.lakeEnd, W, H - ground.lakeEnd);
}

// ---------- Shooting stars ----------
let shootingStars = [];
function spawnShootingStar() {
  const startX = Math.random() * W * 1.2 - W * 0.1;
  const startY = Math.random() * H * 0.7 - H * 0.05;
  const goingRight = Math.random() > 0.5;
  const baseAngle = goingRight ? Math.PI / 4 : Math.PI - Math.PI / 4;
  const angle = baseAngle + (Math.random() * 0.5 - 0.25);
  const speed = Math.random() * 9 + 11;
  shootingStars.push({
    x: startX,
    y: startY,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    len: Math.random() * 80 + 100,
    life: 1,
    decay: Math.random() * 0.012 + 0.012
  });
}

function scheduleNextShootingStar() {
  const delay = Math.random() * 9000 + 6000;
  setTimeout(() => {
    spawnShootingStar();
    scheduleNextShootingStar();
  }, delay);
}
scheduleNextShootingStar();

function drawShootingStars() {
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;

    if (s.life <= 0 || s.x > W + 200 || s.y > H + 200) {
      shootingStars.splice(i, 1);
      continue;
    }

    const dirLen = Math.hypot(s.vx, s.vy);
    const nx = s.vx / dirLen;
    const ny = s.vy / dirLen;
    const tx = s.x - nx * s.len;
    const ty = s.y - ny * s.len;

    const grad = ctx.createLinearGradient(s.x, s.y, tx, ty);
    grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
    grad.addColorStop(0.4, `rgba(200,220,255,${s.life * 0.5})`);
    grad.addColorStop(1, 'rgba(200,220,255,0)');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${s.life})`;
    ctx.arc(s.x, s.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Main loop ----------
function loop(time) {
  drawSky();
  drawStars(time * 0.001 * 1000 / 16.6);
  drawMoon();
  drawGround(time * 0.001);
  drawShootingStars();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<div id="ground"></div><div class="polaroid" style="left:45%;bottom:42vh"><img src="images/photo1.jpg"></div><div class="polaroid" style="left:52%;bottom:48vh"><img src="images/photo2.jpg"></div><div class="modal" id="m"><img id="mi"></div><script>document.getElementById("benchScene").style.width="min(28vw,380px)";document.querySelectorAll(".polaroid img").forEach(i=>i.onclick=()=>{mi.src=i.src;m.style.display="flex"});m.onclick=()=>m.style.display="none";document.addEventListener("keydown",e=>{if(e.key==="Escape")m.style.display="none"});</script></body>
