<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Our Night</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        #sky {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #polaroid-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        .polaroid {
            position: absolute;
            display: block;
            overflow: visible;
            border: 0;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
            transform-origin: 50% 0%;
            will-change: transform;
            touch-action: manipulation;
        }

        .polaroid-card {
            position: absolute;
            inset: 0;
            padding:
                calc(var(--photo-scale) * 5px)
                calc(var(--photo-scale) * 5px)
                calc(var(--photo-scale) * 13px);
            overflow: hidden;
            border:
                calc(var(--photo-scale) * 1px)
                solid rgba(255, 247, 224, 0.9);
            background: #e8dfca;
            box-shadow:
                0 0 calc(var(--photo-scale) * 5px)
                rgba(255, 238, 195, 0.45),
                0 calc(var(--photo-scale) * 4px)
                calc(var(--photo-scale) * 8px)
                rgba(0, 0, 0, 0.45);
        }

        .polaroid-media {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
            background: #151515;
            pointer-events: none;
        }

        .polaroid:hover .polaroid-card,
        .polaroid:focus-visible .polaroid-card {
            box-shadow:
                0 0 calc(var(--photo-scale) * 11px)
                rgba(255, 240, 200, 0.75),
                0 calc(var(--photo-scale) * 5px)
                calc(var(--photo-scale) * 10px)
                rgba(0, 0, 0, 0.5);
        }

        .polaroid:focus-visible {
            outline: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .polaroid {
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <main id="scene">
        <img
            id="background"
            src="assets/background-clean.jpg"
            alt=""
            draggable="false"
        >

        <canvas id="sky"></canvas>

        <div id="polaroid-layer" aria-label="Our memories"></div>
    </main>

    <script>
        const scene = document.querySelector("#scene");
        const background = document.querySelector("#background");
        const polaroidLayer =
            document.querySelector("#polaroid-layer");

        /*
         * These positions were measured from the exact
         * 1448 × 1086 background artwork you uploaded.
         */
        const ORIGINAL_WIDTH = 1448;
        const ORIGINAL_HEIGHT = 1086;

        const memories = [
            {
                type: "image",
                file: "assets/memory-1.jpg",
                x: 67,
                y: 647,
                width: 70,
                height: 73
            },
            {
                type: "image",
                file: "assets/memory-2.jpg",
                x: 130,
                y: 605,
                width: 70,
                height: 67
            },
            {
                type: "image",
                file: "assets/memory-3.jpg",
                x: 267,
                y: 658,
                width: 70,
                height: 74
            },
            {
                type: "image",
                file: "assets/memory-4.jpg",
                x: 324,
                y: 637,
                width: 67,
                height: 67
            },
            {
                type: "image",
                file: "assets/memory-5.jpg",
                x: 365,
                y: 525,
                width: 67,
                height: 66
            },
            {
                type: "image",
                file: "assets/memory-6.jpg",
                x: 446,
                y: 579,
                width: 68,
                height: 67
            },
            {
                type: "image",
                file: "assets/memory-7.jpg",
                x: 526,
                y: 604,
                width: 67,
                height: 67
            },
            {
                type: "image",
                file: "assets/memory-8.jpg",
                x: 585,
                y: 566,
                width: 65,
                height: 67
            },
            {
                type: "video",
                file: "assets/memory-9.mp4",
                x: 633,
                y: 646,
                width: 68,
                height: 68
            },
            {
                type: "video",
                file: "assets/memory-10.mp4",
                x: 680,
                y: 596,
                width: 68,
                height: 68
            }
        ];

        const polaroids = [];

        function createPolaroid(memory, index) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "polaroid";
            button.setAttribute(
                "aria-label",
                `Open memory ${index + 1}`
            );

            const card = document.createElement("span");
            card.className = "polaroid-card";

            let media;

            if (memory.type === "video") {
                media = document.createElement("video");
                media.src = memory.file;
                media.muted = true;
                media.loop = true;
                media.playsInline = true;
                media.preload = "metadata";

                media.addEventListener("loadeddata", () => {
                    media.currentTime = 0.05;
                });
            } else {
                media = document.createElement("img");
                media.src = memory.file;
                media.alt = "";
                media.draggable = false;
            }

            media.className = "polaroid-media";

            card.appendChild(media);
            button.appendChild(card);
            polaroidLayer.appendChild(button);

            const state = {
                element: button,
                media,
                memory,
                angle: (Math.random() - 0.5) * 1.4,
                velocity: 0,
                phase: Math.random() * Math.PI * 2,
                breezeSpeed: 0.00018 + Math.random() * 0.00012,
                breezeStrength: 0.0009 + Math.random() * 0.0007
            };

            button.addEventListener("mouseenter", () => {
                state.velocity +=
                    Math.random() > 0.5 ? 0.09 : -0.09;

                if (memory.type === "video") {
                    media.play().catch(() => {});
                }
            });

            button.addEventListener("mouseleave", () => {
                if (memory.type === "video") {
                    media.pause();
                }
            });

            button.addEventListener("click", () => {
                state.velocity +=
                    Math.random() > 0.5 ? 0.65 : -0.65;

                /*
                 * The photo/video popup will be added here
                 * in the next step.
                 */
            });

            polaroids.push(state);
        }

        memories.forEach(createPolaroid);

        function getBackgroundLayout() {
            const sceneWidth = scene.clientWidth;
            const sceneHeight = scene.clientHeight;

            const scale = Math.max(
                sceneWidth / ORIGINAL_WIDTH,
                sceneHeight / ORIGINAL_HEIGHT
            );

            const renderedWidth = ORIGINAL_WIDTH * scale;
            const renderedHeight = ORIGINAL_HEIGHT * scale;

            return {
                scale,
                offsetX: (sceneWidth - renderedWidth) / 2,
                offsetY: (sceneHeight - renderedHeight) / 2
            };
        }

        function positionPolaroids() {
            const layout = getBackgroundLayout();

            polaroids.forEach((state) => {
                const { memory, element } = state;

                const left =
                    layout.offsetX + memory.x * layout.scale;

                const top =
                    layout.offsetY + memory.y * layout.scale;

                const width = memory.width * layout.scale;
                const height = memory.height * layout.scale;

                element.style.left = `${left}px`;
                element.style.top = `${top}px`;
                element.style.width = `${width}px`;
                element.style.height = `${height}px`;

                element.style.setProperty(
                    "--photo-scale",
                    layout.scale
                );
            });
        }

        let pointerX = -9999;
        let pointerY = -9999;

        window.addEventListener("pointermove", (event) => {
            pointerX = event.clientX;
            pointerY = event.clientY;
        });

        window.addEventListener("pointerleave", () => {
            pointerX = -9999;
            pointerY = -9999;
        });

        function animatePolaroids(time) {
            polaroids.forEach((state) => {
                const rectangle =
                    state.element.getBoundingClientRect();

                const centerX =
                    rectangle.left + rectangle.width / 2;

                const centerY =
                    rectangle.top + rectangle.height / 2;

                const pointerDistance = Math.hypot(
                    pointerX - centerX,
                    pointerY - centerY
                );

                if (pointerDistance < 110) {
                    const direction =
                        pointerX < centerX ? 1 : -1;

                    state.velocity += direction * 0.002;
                }

                const breeze =
                    Math.sin(
                        time * state.breezeSpeed +
                        state.phase
                    ) * state.breezeStrength;

                state.velocity += breeze;

                /*
                 * Spring force pulls the photo toward rest.
                 */
                state.velocity += -state.angle * 0.0045;

                /*
                 * Damping prevents endless swinging.
                 */
                state.velocity *= 0.982;

                state.angle += state.velocity;

                state.angle = Math.max(
                    -2.2,
                    Math.min(2.2, state.angle)
                );

                const verticalMovement =
                    Math.sin(
                        time * 0.00045 +
                        state.phase
                    ) * 0.45;

                state.element.style.transform =
                    `translateY(${verticalMovement}px) ` +
                    `rotate(${state.angle}deg)`;
            });

            requestAnimationFrame(animatePolaroids);
        }

        background.addEventListener(
            "load",
            positionPolaroids
        );

        window.addEventListener(
            "resize",
            positionPolaroids
        );

        if (background.complete) {
            positionPolaroids();
        }

        requestAnimationFrame(animatePolaroids);

        /*
         * Existing sky animation.
         */

        const canvas = document.querySelector("#sky");
        const context =
            canvas.getContext("2d", { alpha: true });

        let width = 0;
        let height = 0;
        let deviceScale = 1;
        let previousFrame = performance.now();

        const stars = [];
        const shootingStars = [];

        function randomBetween(minimum, maximum) {
            return (
                Math.random() *
                (maximum - minimum) +
                minimum
            );
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = randomBetween(0, width);
                this.y = randomBetween(0, height * 0.72);
                this.radius = randomBetween(0.35, 1.25);
                this.baseAlpha =
                    randomBetween(0.04, 0.24);
                this.alphaRange =
                    randomBetween(0.05, 0.18);
                this.phase =
                    randomBetween(0, Math.PI * 2);
                this.speed =
                    randomBetween(0.18, 0.7);
                this.sizePhase =
                    randomBetween(0, Math.PI * 2);
                this.sizeSpeed =
                    randomBetween(0.1, 0.35);
            }

            draw(time) {
                const alpha = Math.max(
                    0,
                    this.baseAlpha +
                    Math.sin(
                        time * this.speed +
                        this.phase
                    ) * this.alphaRange
                );

                const radius = Math.max(
                    0.15,
                    this.radius +
                    Math.sin(
                        time * this.sizeSpeed +
                        this.sizePhase
                    ) * 0.12
                );

                context.beginPath();

                context.fillStyle =
                    `rgba(255, 255, 255, ${alpha})`;

                context.arc(
                    this.x,
                    this.y,
                    radius,
                    0,
                    Math.PI * 2
                );

                context.fill();
            }
        }

        class ShootingStar {
            constructor() {
                this.x = randomBetween(
                    width * 0.1,
                    width * 0.82
                );

                this.y = randomBetween(
                    height * 0.04,
                    height * 0.3
                );

                this.angle =
                    Math.PI / 4 +
                    randomBetween(-0.12, 0.12);

                this.speed =
                    randomBetween(620, 920);

                this.length =
                    randomBetween(90, 180);

                this.age = 0;

                this.lifetime =
                    randomBetween(0.85, 1.25);
            }

            update(deltaTime) {
                this.age += deltaTime;

                this.x +=
                    Math.cos(this.angle) *
                    this.speed *
                    deltaTime;

                this.y +=
                    Math.sin(this.angle) *
                    this.speed *
                    deltaTime;
            }

            draw() {
                const alpha = Math.max(
                    0,
                    1 - this.age / this.lifetime
                );

                context.save();

                context.globalAlpha = alpha * 0.75;
                context.lineWidth = 1.5;
                context.strokeStyle =
                    "rgba(255, 255, 255, 0.9)";
                context.shadowBlur = 10;
                context.shadowColor =
                    "rgba(255, 255, 255, 0.75)";

                context.beginPath();

                context.moveTo(this.x, this.y);

                context.lineTo(
                    this.x -
                    Math.cos(this.angle) *
                    this.length,

                    this.y -
                    Math.sin(this.angle) *
                    this.length
                );

                context.stroke();
                context.restore();
            }

            get finished() {
                return this.age >= this.lifetime;
            }
        }

        function buildStars() {
            stars.length = 0;

            const count = Math.min(
                420,
                Math.max(
                    180,
                    Math.floor(
                        width * height / 3200
                    )
                )
            );

            for (
                let index = 0;
                index < count;
                index += 1
            ) {
                stars.push(new Star());
            }
        }

        function resizeCanvas() {
            deviceScale = Math.min(
                window.devicePixelRatio || 1,
                2
            );

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width =
                Math.round(width * deviceScale);

            canvas.height =
                Math.round(height * deviceScale);

            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            context.setTransform(
                deviceScale,
                0,
                0,
                deviceScale,
                0,
                0
            );

            buildStars();
        }

        let nextShootingStar =
            randomBetween(8, 20);

        function animateSky(now) {
            const deltaTime = Math.min(
                (now - previousFrame) / 1000,
                0.05
            );

            const time = now / 1000;

            previousFrame = now;

            context.clearRect(
                0,
                0,
                width,
                height
            );

            for (const star of stars) {
                star.draw(time);
            }

            nextShootingStar -= deltaTime;

            if (
                nextShootingStar <= 0 &&
                shootingStars.length < 2
            ) {
                shootingStars.push(
                    new ShootingStar()
                );

                nextShootingStar =
                    randomBetween(8, 20);
            }

            for (
                let index =
                    shootingStars.length - 1;
                index >= 0;
                index -= 1
            ) {
                const shootingStar =
                    shootingStars[index];

                shootingStar.update(deltaTime);
                shootingStar.draw();

                if (shootingStar.finished) {
                    shootingStars.splice(
                        index,
                        1
                    );
                }
            }

            requestAnimationFrame(animateSky);
        }

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();
        requestAnimationFrame(animateSky);
    </script>
</body>
</html>
