<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mi Amor ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:
    radial-gradient(circle at top,#1d2951 0%,#090b18 45%,#000000 100%);
    font-family:Arial, Helvetica, sans-serif;
}

/* Moon */

.moon{
    position:absolute;
    top:60px;
    right:90px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#fdf6d8;
    box-shadow:
    0 0 20px #fff,
    0 0 60px #fff,
    0 0 120px rgba(255,255,255,.5);
}

/* Stars */

.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle infinite ease-in-out;
}

@keyframes twinkle{

0%,100%{
opacity:.2;
transform:scale(.8);
}

50%{
opacity:1;
transform:scale(1.3);
}

}

/* Shooting Star */

.shooting-star{

position:absolute;

width:180px;
height:2px;

background:linear-gradient(to right,white,transparent);

transform:rotate(-35deg);

opacity:0;

animation:shoot 7s linear infinite;

}

@keyframes shoot{

0%{
opacity:0;
top:-100px;
left:-300px;
}

10%{
opacity:1;
}

30%{
top:300px;
left:130%;
opacity:0;
}

100%{
opacity:0;
}

}

/* Roses */

.rose{

position:absolute;

font-size:28px;

animation:fall linear infinite;

user-select:none;

}

@keyframes fall{

0%{

transform:translateY(-10vh) rotate(0deg);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:translateY(110vh) rotate(360deg);

opacity:.8;

}

}

/* Center Text */

.center{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

text-align:center;

color:white;

z-index:10;

text-shadow:0 0 20px white;

}

h1{

font-size:55px;

margin-bottom:15px;

}

p{

font-size:22px;

color:#ffd6e7;

}

</style>

</head>

<body>

<div class="moon"></div>

<div class="shooting-star"></div>

<div class="center">

<h1>Para Mi Niña ❤️</h1>

<p>Entre millones de estrellas, siempre te elegiría a ti.</p>

</div>

<script>

/* Stars */

for(let i=0;i<250;i++){

let star=document.createElement("div");

star.className="star";

let size=Math.random()*3+1;

star.style.width=size+"px";

star.style.height=size+"px";

star.style.left=Math.random()*window.innerWidth+"px";

star.style.top=Math.random()*window.innerHeight+"px";

star.style.animationDuration=(Math.random()*3+2)+"s";

star.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(star);

}

/* Roses */

for(let i=0;i<25;i++){

let rose=document.createElement("div");

rose.className="rose";

rose.innerHTML="🌹";

rose.style.left=Math.random()*100+"vw";

rose.style.animationDuration=(Math.random()*8+8)+"s";

rose.style.animationDelay=Math.random()*10+"s";

rose.style.fontSize=(Math.random()*20+20)+"px";

document.body.appendChild(rose);

}

</script>

</body>
</html>
