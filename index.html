<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuestras Memorias</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000;isolation:isolate}
#background{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none;transition:filter 1.2s ease,transform 1.2s ease}
#sky{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;transition:filter 1.1s ease}
#memory-aura{position:absolute;inset:-20%;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,rgba(255,244,210,.18),rgba(255,229,182,.08) 28%,transparent 62%);filter:blur(28px);transform:scale(.92);transition:opacity 1.1s ease,transform 1.1s ease}
#polaroid-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.polaroid{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;pointer-events:auto;transform-origin:50% 0%;will-change:transform;appearance:none;-webkit-appearance:none}
.polaroid-card{position:absolute;inset:0;display:block;overflow:hidden;padding:3px 3px 10px;background:#e8dfcf;border:1px solid rgba(214,199,174,.95);outline:1px solid rgba(255,239,211,.18);outline-offset:-1px;box-shadow:0 0 5px rgba(255,226,177,.28),0 0 12px rgba(221,181,125,.18),0 4px 10px rgba(0,0,0,.48);filter:brightness(.94) sepia(.10) saturate(.88);transition:box-shadow .35s ease,filter .35s ease,transform .35s ease,opacity .35s ease}
.polaroid-media{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;background:#151515}
.polaroid:hover .polaroid-card,.polaroid:focus-visible .polaroid-card{background:#ede4d5;box-shadow:0 0 8px rgba(255,236,204,.55),0 0 20px rgba(225,184,126,.32),0 7px 14px rgba(0,0,0,.52);filter:brightness(1) sepia(.08) saturate(.92);transform:translateY(-2px) scale(1.025)}
.polaroid:focus-visible{outline:none}
.polaroid.is-origin-hidden .polaroid-card{opacity:0}
#memory-dim{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at center,rgba(3,5,12,.12),rgba(0,0,0,.35) 70%,rgba(0,0,0,.58));transition:opacity 1s ease}
#effect-layer{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#memory-stage{position:absolute;inset:0;z-index:6;pointer-events:none}
#memory-card{position:absolute;left:0;top:0;display:none;width:42px;height:57px;padding:0;border:1px solid rgba(255,242,215,.45);border-radius:18px;background:rgba(8,10,16,.88);box-shadow:0 0 18px rgba(255,240,205,.34),0 0 55px rgba(255,222,170,.20),0 24px 65px rgba(0,0,0,.58);transform-origin:center;will-change:transform,width,height,left,top;pointer-events:auto;cursor:zoom-out;overflow:hidden}
#memory-card.is-active{display:block}
#memory-card img,#memory-card video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#090b12;filter:brightness(.96) contrast(1.02) saturate(.94)}
#memory-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(to bottom,rgba(5,8,16,.10),transparent 22%,transparent 74%,rgba(4,6,12,.24));box-shadow:inset 0 0 42px rgba(5,8,16,.34)}
#memory-close{position:absolute;top:14px;right:14px;z-index:10;display:none;width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;color:#fff;background:rgba(8,10,18,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;opacity:0;transform:scale(.85);transition:opacity .35s ease,transform .35s ease}
#memory-close.is-visible{display:block;opacity:1;transform:scale(1)}
body.memory-open #background{filter:blur(1.5px) brightness(.72) saturate(.92);transform:scale(1.006)}
body.memory-open #sky{z-index:8;filter:brightness(1.8) drop-shadow(0 0 3px rgba(255,255,255,.5))}
body.memory-open #memory-dim{opacity:1}
body.memory-open #memory-aura{opacity:1;transform:scale(1)}
.fx-dot,.fx-star,.fx-firefly{position:absolute;border-radius:50%;background:rgba(255,248,226,.95);box-shadow:0 0 10px rgba(255,235,190,.85)}
.fx-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(255,247,220,.8),transparent);transform-origin:left center}
.fx-heart{position:absolute;color:rgba(255,235,220,.95);text-shadow:0 0 12px rgba(255,214,190,.7);font-size:18px}
.fx-ripple{position:absolute;border:1px solid rgba(255,242,210,.7);border-radius:50%;box-shadow:0 0 18px rgba(255,225,180,.25)}
.fx-letter{position:absolute;color:rgba(255,244,220,.92);font-family:Georgia,serif;font-size:28px;letter-spacing:8px;text-shadow:0 0 14px rgba(255,225,180,.55)}
.fx-shoot{position:absolute;width:180px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,236,196,.55),transparent);box-shadow:0 0 10px rgba(255,255,255,.65);transform:rotate(35deg)}
.fx-develop{filter:grayscale(1) brightness(1.35)!important;transition:filter 1.4s ease!important}
@media(max-width:700px){#memory-close{top:max(12px,env(safe-area-inset-top));right:12px}}
#memory-caption{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    width:min(82%,900px);

    color:#f7ecd4;

    font-family:
        "Snell Roundhand",
        "Apple Chancery",
        "Bradley Hand",
        cursive;

    font-size:clamp(22px,2.3vw,38px);
    text-align:center;
    line-height:1.35;

    text-shadow:
        0 2px 8px rgba(0,0,0,.95),
        0 0 18px rgba(255,214,145,.25);

    opacity:0;
    transition:opacity .8s ease 1s;

    pointer-events:none;
}

#memory-caption.show{
    opacity:1;
}
    @media (max-width:700px){

    #scene{
        height:100dvh;
    }

    #background{
        object-fit:contain;
        object-position:center bottom;
    }

    .polaroid{
        min-width:30px;
        min-height:40px;
    }

}
</style>
</head>
<body>
<main id="scene">
<img id="background" src="background-clean.jpg" alt="" draggable="false">
<canvas id="sky" aria-hidden="true"></canvas>
<div id="memory-aura" aria-hidden="true"></div>
<div id="polaroid-layer" aria-label="Our memories"></div>
<div id="memory-dim" aria-hidden="true"></div>
<div id="effect-layer" aria-hidden="true"></div>
<div id="memory-stage">
<div id="memory-card" role="dialog" aria-modal="true" aria-label="Memory"></div>
<button id="memory-close" type="button" aria-label="Close memory">✕</button>
</div>
</main>
<script>
"use strict";

const ORIGINAL_WIDTH=1448;
const ORIGINAL_HEIGHT=1086;
const HANGING_OFFSET=45;

const scene=document.querySelector("#scene");
const background=document.querySelector("#background");
const layer=document.querySelector("#polaroid-layer");
const memoryCard=document.querySelector("#memory-card");
const memoryClose=document.querySelector("#memory-close");
const memoryDim=document.querySelector("#memory-dim");
const effectLayer=document.querySelector("#effect-layer");

const memories = [
{
    type:"image",
    file:"memory-1.jpg",
    x:64,y:630,width:42,height:57,
    effect:"shooting",
    caption:"Ojalá pudiera revivir esta memoria."
},
{
    type:"image",
    file:"memory-2.jpeg",
    x:126,y:586,width:42,height:57,
    effect:"constellation",
    caption:"No tenías idea de lo hermosa que te veías."
},
{
    type:"image",
    file:"memory-3.jpeg",
    x:268,y:642,width:42,height:57,
    effect:"develop",
    caption:"El día que sentí como si fuéramos una familia."
},
{
    type:"image",
    file:"memory-4.jpeg",
    x:323,y:611,width:42,height:57,
    effect:"heartbeat",
    caption:"Manejas mi vida, que no manejes mi troca."
},
{
    type:"image",
    file:"memory-5.jpeg",
    x:366,y:514,width:42,height:57,
    effect:"moon",
    caption:"Tu sonrisa lo es todo para mí."
},
{
    type:"image",
    file:"memory-6.jpeg",
    x:445,y:559,width:42,height:57,
    effect:"stardust",
    caption:"Ojalá pudiéramos congelar el tiempo."
},
{
    type:"image",
    file:"memory-7.jpeg",
    x:525,y:588,width:42,height:57,
    effect:"vortex",
    caption:"Todavía puedo escuchar nuestras risas."
},
{
    type:"image",
    file:"memory-8.JPG",
    x:584,y:548,width:42,height:57,
    effect:"fireflies",
    caption:"Esa mirada me derrite el corazón."
},
{
    type:"video",
    file:"memory-9.mp4",
    x:633,y:646,width:42,height:57,
    effect:"ripple",
    caption:"Podría ver este video mil veces."
},
{
    type:"video",
    file:"memory-10.mp4",
    x:680,y:596,width:42,height:57,
    effect:"ml",
    caption:"Esta memoria me sigue haciendo sonreír cada que la veo."
}
];

let activeState=null;
let isTransitioning=false;

const polaroids=memories.map((memory,index)=>{
const button=document.createElement("button");
button.className="polaroid";
button.type="button";
button.setAttribute("aria-label",`Open memory ${index+1}`);
const card=document.createElement("span");
card.className="polaroid-card";
let media;
if(memory.type==="video"){
media=document.createElement("video");
media.src=memory.file;
media.muted=true;
media.playsInline=true;
media.preload="metadata";
media.poster=index===8?"memory-7.jpeg":"memory-8.JPG";
}else{
media=document.createElement("img");
media.src=memory.file;
media.alt="";
media.draggable=false;
}
media.className="polaroid-media";
card.appendChild(media);
button.appendChild(card);
layer.appendChild(button);
const state={element:button,memory,phase:Math.random()*Math.PI*2,secondPhase:Math.random()*Math.PI*2,speed:.00035+Math.random()*.00018,swayAmount:2.2+Math.random()*1.8,liftAmount:.6+Math.random()*.7};
button.addEventListener("click",()=>{if(!isTransitioning&&!activeState){openMemory(state)}});
return state;
});

function getLayout(){

    const sceneWidth=scene.clientWidth;
    const sceneHeight=scene.clientHeight;

    const isMobile=
        window.innerWidth<=700;

    const scale=isMobile
        ?Math.min(
            sceneWidth/ORIGINAL_WIDTH,
            sceneHeight/ORIGINAL_HEIGHT
        )
        :Math.max(
            sceneWidth/ORIGINAL_WIDTH,
            sceneHeight/ORIGINAL_HEIGHT
        );

    const renderedWidth=
        ORIGINAL_WIDTH*scale;

    const renderedHeight=
        ORIGINAL_HEIGHT*scale;

    return{
        scale,
        offsetX:(sceneWidth-renderedWidth)/2,
        offsetY:isMobile
            ?sceneHeight-renderedHeight
            :(sceneHeight-renderedHeight)/2
    };

}

function positionPolaroids(){

    const layout=getLayout();

    const isMobile=
        window.innerWidth<=700;

    for(const state of polaroids){

        const m=state.memory;

        const width=
            m.width*
            (isMobile
                ?Math.max(layout.scale,.72)
                :layout.scale);

        const height=
            m.height*
            (isMobile
                ?Math.max(layout.scale,.72)
                :layout.scale);

        const x=
            layout.offsetX+
            m.x*layout.scale;

        const y=
            layout.offsetY+
            m.y*layout.scale+
            HANGING_OFFSET*layout.scale;

        state.element.style.left=
            `${x-(width-m.width*layout.scale)/2}px`;

        state.element.style.top=
            `${y}px`;

        state.element.style.width=
            `${width}px`;

        state.element.style.height=
            `${height}px`;

    }

}

function animatePolaroids(time){
for(const state of polaroids){
if(state===activeState){continue}
const rotation=Math.sin(time*state.speed+state.phase)*state.swayAmount;
const secondRotation=Math.sin(time*(state.speed*1.61)+state.secondPhase)*.55;
const verticalMovement=Math.sin(time*(state.speed*.78)+state.phase)*state.liftAmount;
const horizontalMovement=Math.sin(time*(state.speed*.53)+state.secondPhase)*.7;
state.element.style.transform=`translate(${horizontalMovement.toFixed(2)}px,${verticalMovement.toFixed(2)}px) rotate(${(rotation+secondRotation).toFixed(2)}deg)`;
}
requestAnimationFrame(animatePolaroids);
}

function getTargetRect(){
const padding=window.innerWidth<700?18:46;
const availableWidth=window.innerWidth-padding*2;
const availableHeight=window.innerHeight-padding*2;
let width=Math.min(availableWidth,980);
let height=width*.60;
if(height>availableHeight){height=availableHeight;width=height/.60}
return{left:(window.innerWidth-width)/2,top:(window.innerHeight-height)/2,width,height};
}

function setCardRect(rect){
memoryCard.style.left=`${rect.left}px`;
memoryCard.style.top=`${rect.top}px`;
memoryCard.style.width=`${rect.width}px`;
memoryCard.style.height=`${rect.height}px`;
}

function addFx(className,styles={}){
const el=document.createElement("span");
el.className=className;
Object.assign(el.style,styles);
effectLayer.appendChild(el);
return el;
}

function clearEffects(){
effectLayer.replaceChildren();
memoryCard.classList.remove("fx-develop");
memoryCard.style.filter="";
}

function triggerEffect(effect){
clearEffects();

if(effect==="shooting"){
const star=addFx("fx-shoot",{left:"12%",top:"18%",opacity:"0"});
star.animate([{transform:"translate(-220px,-100px) rotate(35deg)",opacity:0},{opacity:1,offset:.25},{transform:"translate(950px,560px) rotate(35deg)",opacity:0}],{duration:1300,easing:"cubic-bezier(.22,.61,.36,1)",fill:"forwards"});
}

if(effect==="constellation"){
for(let i=0;i<8;i++){
const x=18+i*8;
const y=18+Math.sin(i*.9)*8;
addFx("fx-star",{left:`${x}%`,top:`${y}%`,width:"4px",height:"4px"});
if(i<7){
const line=addFx("fx-line",{left:`${x}%`,top:`${y}%`,width:"90px",opacity:"0"});
line.animate([{transform:"scaleX(0)",opacity:0},{transform:"scaleX(1)",opacity:.8}],{duration:900,delay:i*80,fill:"forwards",easing:"ease-out"});
}
}
}

if(effect==="develop"){
memoryCard.classList.add("fx-develop");
setTimeout(()=>{memoryCard.classList.remove("fx-develop")},1500);
}

if(effect==="heartbeat"){
memoryCard.animate([{transform:"scale(1)"},{transform:"scale(1.025)"},{transform:"scale(1)"}],{duration:900,easing:"ease-in-out"});
for(let i=0;i<7;i++){
const heart=addFx("fx-heart",{left:`${38+Math.random()*24}%`,top:`${26+Math.random()*40}%`,opacity:"0"});
heart.textContent="♥";
heart.animate([{transform:"translateY(10px) scale(.7)",opacity:0},{opacity:.9,offset:.25},{transform:"translateY(-70px) scale(1.15)",opacity:0}],{duration:1800+Math.random()*700,delay:i*100,fill:"forwards"});
}
}

if(effect==="moon"){
const glow=addFx("fx-ripple",{left:"72%",top:"7%",width:"150px",height:"150px",opacity:"0"});
glow.animate([{transform:"scale(.6)",opacity:0},{transform:"scale(1.2)",opacity:.55},{transform:"scale(1.6)",opacity:0}],{duration:2200,easing:"ease-out",fill:"forwards"});
}

if(effect==="stardust"){
for(let i=0;i<34;i++){
const dot=addFx("fx-dot",{left:`${10+Math.random()*80}%`,top:`${20+Math.random()*65}%`,width:`${2+Math.random()*3}px`,height:`${2+Math.random()*3}px`,opacity:"0"});
dot.animate([{transform:"translateY(20px)",opacity:0},{opacity:.9,offset:.3},{transform:`translate(${(-20+Math.random()*40)}px,-80px)`,opacity:0}],{duration:2200+Math.random()*2200,delay:Math.random()*800,iterations:2});
}
}

if(effect==="vortex"){
for(let i=0;i<24;i++){
const dot=addFx("fx-star",{left:"50%",top:"50%",width:"3px",height:"3px"});
const radius=80+Math.random()*220;
dot.animate([{transform:"translate(-50%,-50%) rotate(0deg) translateX(20px)",opacity:0},{opacity:.9,offset:.25},{transform:`translate(-50%,-50%) rotate(${360+Math.random()*260}deg) translateX(${radius}px)`,opacity:0}],{duration:2400+Math.random()*900,delay:i*35,fill:"forwards",easing:"cubic-bezier(.2,.7,.3,1)"});
}
}

if(effect==="fireflies"){
for(let i=0;i<18;i++){
const fly=addFx("fx-firefly",{left:`${15+Math.random()*70}%`,top:`${45+Math.random()*40}%`,width:"5px",height:"5px",opacity:"0"});
fly.animate([{transform:"translate(0,0)",opacity:0},{opacity:.8,offset:.25},{transform:`translate(${(-60+Math.random()*120)}px,${(-80+Math.random()*30)}px)`,opacity:0}],{duration:2800+Math.random()*2400,delay:Math.random()*900,iterations:2,easing:"ease-in-out"});
}
}

if(effect==="ripple"){
for(let i=0;i<4;i++){
const ripple=addFx("fx-ripple",{left:"50%",top:"50%",width:"120px",height:"120px",marginLeft:"-60px",marginTop:"-60px",opacity:"0"});
ripple.animate([{transform:"scale(.2)",opacity:.7},{transform:"scale(5)",opacity:0}],{duration:2100,delay:i*350,fill:"forwards",easing:"ease-out"});
}
}

if(effect==="ml"){
const letters=addFx("fx-letter",{left:"67%",top:"18%",opacity:"0"});
letters.textContent="M + L";
letters.animate([{transform:"translateY(8px)",opacity:0},{transform:"translateY(0)",opacity:.95,offset:.45},{opacity:0}],{duration:3200,fill:"forwards",easing:"ease-in-out"});
for(let i=0;i<14;i++){
const dot=addFx("fx-star",{left:`${62+Math.random()*18}%`,top:`${12+Math.random()*18}%`,width:"3px",height:"3px",opacity:"0"});
dot.animate([{opacity:0},{opacity:1,offset:.4},{opacity:0}],{duration:2600,delay:Math.random()*500,fill:"forwards"});
}
}
}

function createMemoryMedia(memory){
if(memory.type==="video"){
const video=document.createElement("video");
video.src=memory.file;
video.controls=true;
video.playsInline=true;
video.autoplay=true;
video.muted=false;
return video;
}
const image=document.createElement("img");
image.src=memory.file;
image.alt="Memory";
image.draggable=false;
return image;
}

function openMemory(state){
isTransitioning=true;
activeState=state;
const origin=state.element.getBoundingClientRect();
const target=getTargetRect();
memoryCard.replaceChildren();

const media=createMemoryMedia(state.memory);

const caption=document.createElement("div");
caption.id="memory-caption";
caption.textContent=state.memory.caption;

memoryCard.appendChild(media);
memoryCard.appendChild(caption);

setTimeout(()=>{
    caption.classList.add("show");
},1000);
setCardRect(origin);
memoryCard.classList.add("is-active");
state.element.classList.add("is-origin-hidden");

requestAnimationFrame(()=>{
document.body.classList.add("memory-open");
triggerEffect(state.memory.effect);
memoryCard.animate(
[
{left:`${origin.left}px`,top:`${origin.top}px`,width:`${origin.width}px`,height:`${origin.height}px`,transform:"rotate(0deg) scale(1)",borderRadius:"2px"},
{offset:.45,transform:"rotate(-1deg) scale(1.03)",borderRadius:"10px"},
{left:`${target.left}px`,top:`${target.top}px`,width:`${target.width}px`,height:`${target.height}px`,transform:"rotate(0deg) scale(1)",borderRadius:"18px"}
],
{duration:1350,easing:"cubic-bezier(.18,.84,.25,1)",fill:"forwards"}
).finished.then(()=>{
setCardRect(target);
memoryCard.style.transform="none";
memoryClose.classList.add("is-visible");
isTransitioning=false;
});
});
}

function closeMemory(){
if(!activeState||isTransitioning){return}
isTransitioning=true;
memoryClose.classList.remove("is-visible");
const current=memoryCard.getBoundingClientRect();
const origin=activeState.element.getBoundingClientRect();
document.body.classList.remove("memory-open");
clearEffects();

memoryCard.animate(
[
{left:`${current.left}px`,top:`${current.top}px`,width:`${current.width}px`,height:`${current.height}px`,transform:"scale(1)",opacity:1},
{offset:.55,transform:"scale(.98)",opacity:1},
{left:`${origin.left}px`,top:`${origin.top}px`,width:`${origin.width}px`,height:`${origin.height}px`,transform:"scale(1)",opacity:.95}
],
{duration:1150,easing:"cubic-bezier(.22,.61,.36,1)",fill:"forwards"}
).finished.then(()=>{
activeState.element.classList.remove("is-origin-hidden");
memoryCard.classList.remove("is-active");
memoryCard.replaceChildren();
memoryCard.removeAttribute("style");
activeState=null;
isTransitioning=false;
});
}

memoryClose.addEventListener("click",closeMemory);
memoryDim.addEventListener("click",closeMemory);
memoryCard.addEventListener("click",(event)=>{if(event.target.tagName!=="VIDEO"){closeMemory()}});
window.addEventListener("keydown",(event)=>{if(event.key==="Escape"){closeMemory()}});

background.addEventListener("load",positionPolaroids);
window.addEventListener("resize",()=>{positionPolaroids();if(activeState&&!isTransitioning){setCardRect(getTargetRect())}});
if(background.complete){positionPolaroids()}
requestAnimationFrame(animatePolaroids);

const canvas=document.querySelector("#sky");
const ctx=canvas.getContext("2d",{alpha:true});
let width=0,height=0,dpr=1,last=performance.now(),nextMeteor=8+Math.random()*12;
const stars=[],meteors=[];

function rand(a,b){return Math.random()*(b-a)+a}

class Star{
constructor(){this.x=rand(0,width);this.y=rand(0,height*.72);this.r=rand(.3,1.15);this.base=rand(.03,.2);this.range=rand(.04,.16);this.phase=rand(0,Math.PI*2);this.speed=rand(.16,.65)}
draw(t){
const open=document.body.classList.contains("memory-open");
const boost=open?1.65:1;
const sparkle=open?Math.max(0,Math.sin(t*2.8+this.phase))*.12:0;
const a=Math.max(0,(this.base+Math.sin(t*this.speed+this.phase)*this.range+sparkle)*boost);
ctx.beginPath();
ctx.fillStyle=`rgba(255,255,255,${Math.min(a,.95)})`;
ctx.arc(this.x,this.y,open?this.r*1.15:this.r,0,Math.PI*2);
ctx.fill();
}
}

class Meteor{
constructor(){this.x=rand(width*.1,width*.8);this.y=rand(height*.04,height*.28);this.angle=Math.PI/4+rand(-.12,.12);this.speed=rand(620,900);this.length=rand(90,175);this.age=0;this.life=rand(.85,1.2)}
update(dt){this.age+=dt;this.x+=Math.cos(this.angle)*this.speed*dt;this.y+=Math.sin(this.angle)*this.speed*dt}
draw(){const a=Math.max(0,1-this.age/this.life);ctx.save();ctx.globalAlpha=a*.7;ctx.lineWidth=1.5;ctx.strokeStyle="rgba(255,255,255,.9)";ctx.shadowBlur=10;ctx.shadowColor="rgba(255,255,255,.75)";ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-Math.cos(this.angle)*this.length,this.y-Math.sin(this.angle)*this.length);ctx.stroke();ctx.restore()}
get done(){return this.age>=this.life}
}

function buildStars(){stars.length=0;const count=Math.min(400,Math.max(170,Math.floor(width*height/3400)));for(let i=0;i<count;i++){stars.push(new Star())}}
function resizeCanvas(){dpr=Math.min(window.devicePixelRatio||1,2);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=`${width}px`;canvas.style.height=`${height}px`;ctx.setTransform(dpr,0,0,dpr,0,0);buildStars()}
function animateSky(now){const dt=Math.min((now-last)/1000,.05);const t=now/1000;last=now;ctx.clearRect(0,0,width,height);for(const star of stars){star.draw(t)}nextMeteor-=dt;if(nextMeteor<=0&&meteors.length<2){meteors.push(new Meteor());nextMeteor=8+Math.random()*12}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.update(dt);m.draw();if(m.done){meteors.splice(i,1)}}requestAnimationFrame(animateSky)}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();
requestAnimationFrame(animateSky);
</script>
</body>
