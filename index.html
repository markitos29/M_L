<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Night</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:system-ui,sans-serif;
}

#scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    user-select:none;
    pointer-events:none;
    -webkit-user-drag:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="scene">

<img
id="background"
src="background.jpg"
alt="">

<canvas id="canvas"></canvas>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h,dpr;

function resize(){

    dpr=Math.min(window.devicePixelRatio||1,2);

    w=window.innerWidth;
    h=window.innerHeight;

    canvas.width=w*dpr;
    canvas.height=h*dpr;

    canvas.style.width=w+"px";
    canvas.style.height=h+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

}

window.addEventListener("resize",resize);

resize();

function rand(a,b){
    return Math.random()*(b-a)+a;
}

const stars=[];

class Star{

    constructor(){

        this.x=rand(0,w);
        this.y=rand(0,h*.72);

        this.size=rand(.4,1.3);

        this.alpha=rand(.05,.25);

        this.phase=Math.random()*Math.PI*2;

        this.speed=rand(.15,.7);

        this.glow=rand(2,7);

        this.grow=rand(.08,.25);

    }

    draw(t){

        const a=this.alpha+
        Math.sin(t*this.speed+this.phase)*.18;

        const r=this.size+
        Math.sin(t*this.grow+this.phase)*.18;

        ctx.beginPath();

        ctx.fillStyle=`rgba(255,255,255,${Math.max(a,0)})`;

        ctx.shadowBlur=this.glow;

        ctx.shadowColor="white";

        ctx.arc(
            this.x,
            this.y,
            Math.max(.2,r),
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

    }

}

function buildStars(){

    stars.length=0;

    for(let i=0;i<420;i++){

        stars.push(new Star());

    }

}

buildStars();
