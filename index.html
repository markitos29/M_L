<!DOCTYPE html>
<html>
<head>
<title>M + L</title>

<style>
body{
margin:0;
overflow:hidden;
background:#020617;
}

canvas{
display:block;
}
</style>

</head>

<body>

<canvas id="c"></canvas>


<script>

const c=document.getElementById("c");
const x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;


let stars=[];
let shots=[];
let ml=0;
let fade=true;


// stars

for(let i=0;i<350;i++){

stars.push({

x:Math.random()*c.width,
y:Math.random()*c.height*.65,
r:Math.random()*2,
a:Math.random()

});

}


// shooting stars

setInterval(()=>{

shots.push({

x:Math.random()*c.width,
y:50+Math.random()*200,
s:10

});

},2200);



function sky(){

let g=x.createLinearGradient(0,0,0,c.height);

g.addColorStop(0,"#020617");
g.addColorStop(.7,"#172554");
g.addColorStop(1,"#000");

x.fillStyle=g;
x.fillRect(0,0,c.width,c.height);

}




function drawStars(){

stars.forEach(s=>{

x.fillStyle=
`rgba(255,255,255,${s.a})`;

x.beginPath();

x.arc(s.x,s.y,s.r,0,Math.PI*2);

x.fill();


s.a+=(Math.random()-.5)*.03;

});

}




function moon(){

x.shadowBlur=50;
x.shadowColor="white";

x.fillStyle="#eee";

x.beginPath();

x.arc(
c.width-170,
140,
70,
0,
Math.PI*2
);

x.fill();

x.shadowBlur=0;


// reflection

let g=x.createLinearGradient(
0,
400,
0,
700
);

g.addColorStop(0,"rgba(255,255,255,.4)");
g.addColorStop(1,"transparent");


x.fillStyle=g;

x.fillRect(
c.width-210,
250,
80,
350
);

}





function shooting(){

shots.forEach((s,i)=>{

let g=x.createLinearGradient(
s.x,
s.y,
s.x-100,
s.y+100
);

g.addColorStop(0,"white");
g.addColorStop(1,"transparent");


x.strokeStyle=g;
x.lineWidth=3;

x.beginPath();

x.moveTo(s.x,s.y);

x.lineTo(
s.x-100,
s.y+100
);

x.stroke();


s.x+=s.s;
s.y+=s.s;


if(s.x>c.width)
shots.splice(i,1);


});

}





function landscape(){


// lake

x.fillStyle="#020617";

x.fillRect(
0,
c.height*.7,
c.width,
c.height
);



// tree

x.fillStyle="#111827";

x.fillRect(
100,
c.height*.35,
40,
300
);


x.beginPath();

x.arc(
120,
c.height*.35,
130,
0,
Math.PI*2
);

x.fill();


// bench

x.fillStyle="#78350f";

x.fillRect(
c.width/2-120,
c.height*.72,
240,
20
);


// people


x.fillStyle="#000";


x.beginPath();

x.arc(
c.width/2-25,
c.height*.65,
25,
0,
Math.PI*2
);

x.fill();


x.fillRect(
c.width/2-50,
c.height*.68,
50,
90
);


// girl

x.beginPath();

x.arc(
c.width/2+35,
c.height*.65,
25,
0,
Math.PI*2
);

x.fill();


x.fillRect(
c.width/2+10,
c.height*.68,
50,
90
);


// curly hair

x.strokeStyle="#4b2e20";
x.lineWidth=8;

for(let i=0;i<6;i++){

x.beginPath();

x.arc(
c.width/2+35+i*3,
c.height*.63,
25+i,
0,
Math.PI
);

x.stroke();

}


}





function constellation(){

let a=ml;

x.globalAlpha=a;

x.strokeStyle="white";
x.lineWidth=2;


let p=[
[-60,0],
[-30,-50],
[0,0],
[40,-50],
[40,20],
[80,20]
];


x.beginPath();

p.forEach((v,i)=>{

if(i==0)
x.moveTo(c.width/2+v[0],170+v[1]);
else
x.lineTo(c.width/2+v[0],170+v[1]);

});


x.stroke();


x.font="35px serif";

x.fillText(
"M + L",
c.width/2-45,
270
);


x.globalAlpha=1;



if(fade)
ml+=.01;
else
ml-=.01;


if(ml>=1)fade=false;

if(ml<=0)fade=true;


}





function loop(){

sky();

drawStars();

moon();

shooting();

landscape();

constellation();


requestAnimationFrame(loop);

}


loop();

</script>


</body>
</html>
