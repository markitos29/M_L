<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Night Garden</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at 70% 20%, rgba(90,80,180,.25), transparent 35%),
    radial-gradient(circle at 20% 80%, rgba(255,80,120,.12), transparent 30%),
    linear-gradient(#02010b,#05051a 60%,#000);
}


/* Nebula */

body::before{

content:"";

position:absolute;

width:100%;
height:100%;

background:
radial-gradient(circle at 30% 40%,rgba(255,0,120,.08),transparent 30%),
radial-gradient(circle at 80% 70%,rgba(0,120,255,.08),transparent 35%);

filter:blur(50px);

}


/* Moon */

.moon{

position:absolute;

top:70px;
right:100px;

width:150px;
height:150px;

border-radius:50%;

background:
radial-gradient(circle at 35% 35%,#fff,#eee 45%,#ccc);

box-shadow:

0 0 30px white,
0 0 80px rgba(255,255,255,.6),
0 0 150px rgba(255,255,255,.25);

}


/* Moon craters */

.moon::before{

content:"";

position:absolute;

width:25px;
height:25px;

background:#bbb;

border-radius:50%;

top:40px;
left:35px;

box-shadow:

45px 30px 0 8px #c4c4c4,
25px 80px 0 5px #aaa;

opacity:.35;

}



/* Stars */

.star{

position:absolute;

background:white;

border-radius:50%;

}



.star.glow{

box-shadow:
0 0 5px white,
0 0 12px white;

animation:twinkle 3s infinite;

}


@keyframes twinkle{

0%,100%{

opacity:.3;

}

50%{

opacity:1;

}

}



/* Shooting Stars */

.shooting{

position:absolute;

height:2px;

width:180px;

background:
linear-gradient(90deg,
white,
transparent);

transform:rotate(-35deg);

animation:shoot 6s linear infinite;

opacity:0;

}


@keyframes shoot{


0%{

left:-300px;
top:100px;
opacity:0;

}


10%{

opacity:1;

}


30%{

left:120vw;
top:400px;

opacity:0;

}


100%{

opacity:0;

}


}



/* Rose petals */


.petal{

position:absolute;

width:15px;

height:20px;

background:#9b0035;

border-radius:100% 0 100% 0;

opacity:.8;

filter:drop-shadow(0 0 5px crimson);

animation:fall linear infinite;

}


@keyframes fall{


0%{

transform:
translateY(-10vh)
rotate(0deg);

}


100%{

transform:
translateY(110vh)
translateX(80px)
rotate(720deg);

}


}


</style>

</head>


<body>


<div class="moon"></div>


<script>


// Create realistic stars

for(let i=0;i<350;i++){


let star=document.createElement("div");

star.className="star";


let size=Math.random()*2.5;


star.style.width=size+"px";

star.style.height=size+"px";


star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";


if(Math.random()>.75){

star.classList.add("glow");

star.style.animationDelay=Math.random()*4+"s";

}


document.body.appendChild(star);


}



// Shooting stars

function shootingStar(){

let star=document.createElement("div");

star.className="shooting";

star.style.top=Math.random()*40+"vh";

star.style.animationDuration=
(Math.random()*3+4)+"s";


document.body.appendChild(star);


setTimeout(()=>{

star.remove();

},6000);


}


setInterval(shootingStar,3500);



// Rose petals

for(let i=0;i<50;i++){


let petal=document.createElement("div");

petal.className="petal";


petal.style.left=Math.random()*100+"vw";


petal.style.animationDuration=
(Math.random()*8+8)+"s";


petal.style.animationDelay=
Math.random()*10+"s";


petal.style.transform=
`rotate(${Math.random()*360}deg)`;


document.body.appendChild(petal);


}


</script>


</body>
</html>
